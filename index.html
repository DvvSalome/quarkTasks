<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280"/>
  <title>Quark Tasking · Operational</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>/* ============================================
   QUARK TASKING — Design System
   ============================================ */

:root {
  /* Morado claro — lavanda suave (modo oscuro violeta, legible) */
  --bg-0: oklch(0.24 0.05 305);
  --bg-1: oklch(0.28 0.055 302);
  --bg-2: oklch(0.32 0.05 300);
  --bg-3: oklch(0.36 0.048 298);
  --surface: oklch(0.3 0.05 302 / 0.88);
  --surface-elev: oklch(0.34 0.052 300 / 0.94);

  --line-faint: oklch(0.45 0.06 295 / 0.35);
  --line: oklch(0.55 0.07 298 / 0.45);
  --line-strong: oklch(0.65 0.09 300 / 0.55);

  --fg-0: oklch(0.97 0.02 305);
  --fg-1: oklch(0.9 0.03 300);
  --fg-2: oklch(0.72 0.05 298);
  --fg-3: oklch(0.55 0.06 296);

  --violet: oklch(0.78 0.14 304);
  --violet-hi: oklch(0.86 0.12 306);
  --violet-lo: oklch(0.55 0.14 300);
  --violet-glow: oklch(0.78 0.14 304 / 0.45);
  --violet-fog: oklch(0.7 0.12 302 / 0.2);

  --cyan: oklch(0.78 0.1 230);
  --cyan-fog: oklch(0.78 0.1 230 / 0.14);
  --amber: oklch(0.88 0.14 85);
  --amber-fog: oklch(0.88 0.14 85 / 0.16);
  --rose: oklch(0.72 0.16 15);
  --rose-fog: oklch(0.72 0.16 15 / 0.15);
  --green: oklch(0.8 0.14 155);
  --green-fog: oklch(0.8 0.14 155 / 0.15);

  --font-sans: "Plus Jakarta Sans", "Inter", -apple-system, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
}

[data-theme="light"] {
  /* Morado muy claro — casi lavanda papel */
  --bg-0: oklch(0.98 0.025 305);
  --bg-1: oklch(0.965 0.03 303);
  --bg-2: oklch(0.945 0.035 302);
  --bg-3: oklch(0.92 0.038 300);
  --surface: oklch(0.995 0.02 305 / 0.96);
  --surface-elev: oklch(1 0.015 305 / 0.99);
  --line-faint: oklch(0.82 0.04 300 / 0.45);
  --line: oklch(0.74 0.05 298 / 0.55);
  --line-strong: oklch(0.62 0.07 296 / 0.38);
  --fg-0: oklch(0.22 0.05 305);
  --fg-1: oklch(0.34 0.055 302);
  --fg-2: oklch(0.48 0.06 300);
  --fg-3: oklch(0.58 0.06 298);
  --violet-glow: oklch(0.62 0.18 302 / 0.35);
  --violet-fog: oklch(0.65 0.16 304);
  --violet: oklch(0.58 0.19 302);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background: var(--bg-0);
  color: var(--fg-0);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

#root {
  height: 100vh;
  overflow: hidden;
}

/* ============================================
   COSMIC BACKGROUND
   ============================================ */
.cosmos {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.cosmos::before {
  content: "";
  position: absolute;
  inset: -25%;
  background:
    radial-gradient(ellipse 55% 45% at 20% 15%, var(--violet-fog), transparent 55%),
    radial-gradient(ellipse 45% 40% at 88% 72%, oklch(0.72 0.1 280 / 0.12), transparent 55%),
    radial-gradient(ellipse 50% 35% at 48% 100%, oklch(0.82 0.08 320 / 0.1), transparent 60%);
  filter: blur(48px);
}
.cosmos-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--line-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-faint) 1px, transparent 1px);
  background-size: 64px 64px;
  background-position: -1px -1px;
  mask-image: radial-gradient(ellipse 85% 65% at 50% 35%, black 25%, transparent 75%);
  opacity: 0.22;
}
.cosmos-stars {
  position: absolute;
  inset: 0;
}
.star {
  position: absolute;
  width: 2px; height: 2px;
  background: var(--amber);
  border-radius: 50%;
  opacity: 0.22;
  animation: twinkle 5s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; }
  50% { opacity: 0.45; }
}

@keyframes page-enter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes routine-row-in {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ============================================
   APP SHELL
   ============================================ */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  border-right: 1px solid var(--line-faint);
  background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 18px;
  border-bottom: 1px dashed var(--line-faint);
  margin-bottom: 14px;
}
.brand-mark {
  width: 28px; height: 28px;
  position: relative;
  flex-shrink: 0;
}
.brand-mark svg { width: 100%; height: 100%; }
.brand-name {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.nav-section {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 14px 8px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-md);
  color: var(--fg-1);
  cursor: pointer;
  font-size: 13px;
  border: 1px solid transparent;
  transition: all 0.15s;
  position: relative;
}
.nav-item:hover {
  background: var(--bg-2);
  color: var(--fg-0);
}
.nav-item.active {
  background: var(--violet-fog);
  color: var(--fg-0);
  border-color: var(--line-strong);
}
.nav-item.active::before {
  content: "";
  position: absolute;
  left: -14px; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px;
  background: var(--violet);
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 12px var(--violet-glow);
}
.nav-item .icon {
  width: 16px; height: 16px;
  display: grid;
  place-items: center;
  color: var(--fg-2);
}
.nav-item.active .icon { color: var(--violet-hi); }
.nav-item .badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  background: var(--bg-2);
  padding: 1px 6px;
  border-radius: 4px;
}

/* ============================================
   TOPBAR
   ============================================ */
.main {
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--line-faint);
  background: linear-gradient(180deg, var(--bg-0), transparent);
  backdrop-filter: blur(12px);
}
.crumb {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.crumb b {
  color: var(--fg-1);
  font-weight: 500;
}
.topbar-spacer { flex: 1; }

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  min-width: 220px;
}
.search kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-3);
  border: 1px solid var(--line-faint);
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: auto;
  color: var(--fg-2);
}

.lang-toggle {
  display: flex;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 2px;
}
.lang-toggle button {
  background: transparent;
  border: none;
  color: var(--fg-3);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.lang-toggle button.active {
  background: var(--violet-fog);
  color: var(--fg-0);
}

.user-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: 999px;
}
.avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--violet), var(--cyan));
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 600;
  color: white;
}

/* ============================================
   PAGE CONTENT
   ============================================ */
.page {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 32px 60px;
  animation: page-enter 0.55s var(--ease-out) both;
}
.page-head {
  margin-bottom: 24px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
}
.page-head h1 {
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.page-head h1 em {
  font-style: normal;
  color: var(--violet-hi);
}
.page-head p {
  color: var(--fg-2);
  font-size: 13px;
  max-width: 60ch;
}
.page-head .meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ============================================
   CARDS / PANELS
   ============================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  padding: 18px;
  position: relative;
  backdrop-filter: blur(10px);
  transition: transform 0.28s var(--ease-out), border-color 0.2s, box-shadow 0.28s var(--ease-out);
}
.card:hover {
  transform: translateY(-2px);
  border-color: var(--line);
  box-shadow: 0 14px 40px oklch(0.05 0.02 80 / 0.35);
}
.card-glow {
  position: relative;
  overflow: hidden;
}
.card-glow::before {
  content: "";
  position: absolute;
  inset: -1px;
  background: linear-gradient(135deg, var(--violet-glow), transparent 50%, transparent);
  border-radius: inherit;
  pointer-events: none;
  opacity: 0.6;
  z-index: -1;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--violet);
  box-shadow: 0 0 8px var(--violet);
}
.card-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ============================================
   QUARK / ATOM
   ============================================ */
.atom {
  position: relative;
  display: inline-grid;
  place-items: center;
}
.atom svg {
  display: block;
}
.atom .core {
  fill: var(--violet);
  filter: drop-shadow(0 0 4px var(--violet-glow));
}
.atom .orbit {
  fill: none;
  stroke: var(--violet);
  stroke-width: 1;
  opacity: 0.5;
}
.atom .electron {
  fill: var(--cyan);
  filter: drop-shadow(0 0 3px var(--cyan));
}
@keyframes spin { to { transform: rotate(360deg); } }
.atom .orbit-1 { transform-origin: center; animation: spin 8s linear infinite; }
.atom .orbit-2 { transform-origin: center; animation: spin 6s linear infinite reverse; }
.atom .orbit-3 { transform-origin: center; animation: spin 11s linear infinite; }

/* ============================================
   DASHBOARD
   ============================================ */
.dash {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
.metric {
  grid-column: span 3;
  position: relative;
  overflow: hidden;
}
.metric .num {
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.03em;
  font-feature-settings: "tnum";
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.metric .num small {
  font-size: 12px;
  font-weight: 400;
  color: var(--fg-3);
  font-family: var(--font-mono);
}
.metric .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 8px;
}
.metric .delta {
  font-family: var(--font-mono);
  font-size: 11px;
  margin-top: 6px;
  color: var(--green);
}
.metric .delta.down { color: var(--rose); }
.metric .spark {
  position: absolute;
  bottom: 0; right: 0;
  width: 70%;
  height: 36px;
  opacity: 0.7;
}

.dash-col-8 { grid-column: span 8; }
.dash-col-4 { grid-column: span 4; }
.dash-col-6 { grid-column: span 6; }
.dash-col-12 { grid-column: span 12; }

/* AI insight feed */
.insight {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  background: var(--bg-1);
  margin-bottom: 8px;
  align-items: start;
  cursor: pointer;
  transition: all 0.2s;
}
.insight:hover {
  border-color: var(--line-strong);
  background: var(--bg-2);
}
.insight-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--violet-fog);
  color: var(--violet-hi);
  border: 1px solid var(--line-strong);
}
.insight-icon.warn { background: var(--amber-fog); color: var(--amber); border-color: var(--amber); }
.insight-icon.danger { background: var(--rose-fog); color: var(--rose); border-color: var(--rose); }
.insight-icon.ok { background: var(--green-fog); color: var(--green); border-color: var(--green); }
.insight-body { min-width: 0; }
.insight-body .t {
  font-size: 13px;
  margin-bottom: 2px;
  color: var(--fg-0);
}
.insight-body .d {
  font-size: 12px;
  color: var(--fg-2);
}
.insight-body .meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  margin-top: 4px;
  letter-spacing: 0.05em;
}
.insight-cta {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--violet-hi);
  white-space: nowrap;
  align-self: center;
}

/* Quark cluster (project tasks visualization) */
.quark-field {
  position: relative;
  height: 280px;
  border-radius: var(--r-md);
  background:
    radial-gradient(circle at 50% 50%, var(--violet-fog), transparent 60%),
    var(--bg-1);
  border: 1px solid var(--line-faint);
  overflow: hidden;
}
.quark-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* Project list rows */
.proj-row {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  align-items: center;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}
.proj-row:hover {
  background: var(--bg-2);
  border-color: var(--line-faint);
}
.proj-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
}
.proj-name { font-size: 13px; }
.proj-name small {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.05em;
  margin-top: 2px;
}
.proj-progress {
  width: 80px;
  height: 4px;
  background: var(--bg-2);
  border-radius: 2px;
  overflow: hidden;
}
.proj-progress > div {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--violet), var(--cyan));
  box-shadow: 0 0 8px var(--violet-glow);
  border-radius: 2px;
  transition: width 0.65s var(--ease-out);
}
.proj-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* Routine panel — day planning */
.routine-head-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.routine-seg {
  display: inline-flex;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.routine-seg button {
  border: none;
  background: transparent;
  color: var(--fg-2);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.routine-seg button.active {
  background: var(--violet-fog);
  color: var(--fg-0);
  border: 1px solid var(--line);
}
.routine-hint {
  font-size: 11px;
  color: var(--fg-2);
  line-height: 1.45;
  margin: 10px 0 12px;
  padding: 10px 12px;
  background: var(--bg-1);
  border-radius: var(--r-md);
  border: 1px dashed var(--line-faint);
}
.routine-hint em {
  font-style: normal;
  color: var(--violet-hi);
  font-weight: 600;
}
.routine-progress-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.routine-ring {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: conic-gradient(var(--violet) calc(var(--p, 0) * 1%), var(--bg-2) 0);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background 0.5s var(--ease-out);
}
.routine-ring-inner {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-1);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-0);
}
.routine-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--line-faint);
  align-items: center;
  animation: routine-row-in 0.4s var(--ease-out) both;
}
.routine-row:last-child { border-bottom: none; }
.routine-check {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  flex-shrink: 0;
}
.routine-check:hover { transform: scale(1.06); border-color: var(--violet-hi); }
.routine-check.on {
  background: var(--green-fog);
  border-color: var(--green);
}
.routine-check svg { opacity: 0; }
.routine-check.on svg { opacity: 1; color: var(--green); }
.routine-move {
  font-size: 11px;
  font-weight: 500;
  color: var(--cyan);
  background: transparent;
  border: 1px solid var(--line-faint);
  border-radius: var(--r-sm);
  padding: 4px 8px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, border-color 0.2s;
}
.routine-move:hover {
  background: var(--cyan-fog);
  border-color: var(--cyan);
}
.routine-form {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line-faint);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.routine-form-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.routine-form input[type="text"],
.routine-form select {
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  color: var(--fg-0);
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 8px 10px;
}
.routine-form input[type="text"] { flex: 1; min-width: 140px; }
.routine-form select { cursor: pointer; }
.btn-routine-add {
  border: none;
  border-radius: var(--r-md);
  background: var(--violet);
  color: oklch(0.99 0.01 85);
  font-weight: 600;
  font-size: 12px;
  padding: 8px 14px;
  cursor: pointer;
  transition: filter 0.2s, transform 0.15s;
}
.btn-routine-add:hover { filter: brightness(1.06); transform: translateY(-1px); }

/* ============================================
   STATUS / PRIORITY PILLS
   ============================================ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  color: var(--fg-2);
  white-space: nowrap;
}
.pill .dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.pill.violet { background: var(--violet-fog); color: var(--violet-hi); border-color: var(--line-strong); }
.pill.cyan { background: var(--cyan-fog); color: var(--cyan); border-color: oklch(0.5 0.12 220 / 0.5); }
.pill.amber { background: var(--amber-fog); color: var(--amber); border-color: oklch(0.55 0.15 75 / 0.5); }
.pill.rose { background: var(--rose-fog); color: var(--rose); border-color: oklch(0.5 0.18 15 / 0.5); }
.pill.green { background: var(--green-fog); color: var(--green); border-color: oklch(0.5 0.15 150 / 0.5); }

/* ============================================
   CAPTURE
   ============================================ */
.capture-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  height: calc(100vh - 130px);
}
.capture-input {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.capture-textarea {
  flex: 1;
  min-height: 320px;
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  padding: 18px;
  color: var(--fg-0);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  resize: none;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.capture-textarea:focus {
  border-color: var(--violet);
  box-shadow: 0 0 0 3px var(--violet-fog);
}
.capture-textarea::placeholder {
  color: var(--fg-3);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  color: var(--fg-1);
  font-family: var(--font-sans);
  font-size: 13px;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { background: var(--bg-3); color: var(--fg-0); border-color: var(--line); }
.btn-primary {
  background: linear-gradient(135deg, var(--violet), var(--violet-lo));
  border-color: var(--violet);
  color: white;
  box-shadow: 0 0 0 1px var(--violet-fog), 0 4px 16px var(--violet-glow);
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--violet-hi), var(--violet));
  box-shadow: 0 0 0 1px var(--violet-fog), 0 8px 24px var(--violet-glow);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--fg-2);
}
.btn-ghost:hover { background: var(--bg-2); color: var(--fg-0); border-color: var(--line-faint); }

.capture-output {
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  padding: 18px;
  overflow-y: auto;
  position: relative;
}

.thinking-trace {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-2);
  background: var(--bg-0);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 16px;
  max-height: 180px;
  overflow-y: auto;
  line-height: 1.6;
}
.thinking-trace .line {
  display: flex;
  gap: 8px;
  opacity: 0;
  animation: fadeIn 0.3s ease forwards;
}
.thinking-trace .line .ts { color: var(--fg-3); }
.thinking-trace .line .tag {
  color: var(--violet-hi);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.08em;
}
.thinking-trace .line .tag.detect { color: var(--cyan); }
.thinking-trace .line .tag.warn { color: var(--amber); }
.thinking-trace .line .tag.ok { color: var(--green); }
.thinking-trace .cursor {
  display: inline-block;
  width: 6px; height: 12px;
  background: var(--violet);
  vertical-align: text-bottom;
  animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes fadeIn { to { opacity: 1; } }

.struct-project {
  margin-bottom: 14px;
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  overflow: hidden;
  opacity: 0;
  transform: translateY(8px);
  animation: slideIn 0.4s ease forwards;
}
@keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
.struct-project-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line-faint);
}
.struct-project-head .name { font-size: 13px; font-weight: 500; }
.struct-project-head .meta { margin-left: auto; }
.struct-task {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 10px;
  padding: 8px 12px;
  font-size: 12px;
  border-top: 1px solid var(--line-faint);
  align-items: center;
}
.struct-task:first-child { border-top: none; }
.struct-task .check {
  width: 14px; height: 14px;
  border: 1px solid var(--line);
  border-radius: 3px;
}
.struct-task .pills { display: flex; gap: 4px; }

/* ============================================
   ROADMAP
   ============================================ */
.roadmap {
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  padding: 16px;
  overflow: auto;
}
.roadmap-header {
  display: grid;
  grid-template-columns: 220px repeat(8, 1fr);
  gap: 0;
  border-bottom: 1px solid var(--line-faint);
  padding-bottom: 8px;
  margin-bottom: 8px;
  position: sticky; top: 0;
  background: var(--bg-1);
  z-index: 2;
}
.roadmap-header > div {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: 4px 8px;
  border-left: 1px dashed var(--line-faint);
}
.roadmap-header > div:first-child { border-left: none; color: var(--fg-2); }
.roadmap-header .now {
  color: var(--violet-hi);
  position: relative;
}
.roadmap-header .now::before {
  content: "";
  position: absolute;
  left: 50%; top: 100%;
  width: 1px; height: 600px;
  background: linear-gradient(180deg, var(--violet), transparent);
  pointer-events: none;
}

.roadmap-row {
  display: grid;
  grid-template-columns: 220px repeat(8, 1fr);
  border-bottom: 1px dashed var(--line-faint);
  min-height: 56px;
  position: relative;
}
.roadmap-label {
  padding: 12px 8px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.roadmap-label small {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
}
.roadmap-cell {
  border-left: 1px dashed var(--line-faint);
  position: relative;
}
.roadmap-bar {
  position: absolute;
  top: 12px;
  height: 30px;
  background: linear-gradient(90deg, var(--violet-fog), var(--violet-fog));
  border: 1px solid var(--violet);
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 11px;
  color: var(--fg-0);
  cursor: pointer;
  transition: all 0.2s;
}
.roadmap-bar:hover {
  filter: brightness(1.1);
  box-shadow: 0 0 0 1px var(--violet), 0 4px 16px var(--violet-glow);
}
.roadmap-bar.cyan { background: var(--cyan-fog); border-color: var(--cyan); }
.roadmap-bar.amber { background: var(--amber-fog); border-color: var(--amber); }
.roadmap-bar.green { background: var(--green-fog); border-color: var(--green); }
.roadmap-bar.rose { background: var(--rose-fog); border-color: var(--rose); }
.roadmap-bar .progress {
  position: absolute;
  inset: 0;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--violet) var(--p, 0%), transparent var(--p, 0%));
  opacity: 0.4;
  pointer-events: none;
}
.roadmap-bar.cyan .progress { background: linear-gradient(90deg, var(--cyan) var(--p), transparent var(--p)); }
.roadmap-bar.amber .progress { background: linear-gradient(90deg, var(--amber) var(--p), transparent var(--p)); }
.roadmap-bar.green .progress { background: linear-gradient(90deg, var(--green) var(--p), transparent var(--p)); }

.roadmap-bar .bar-label {
  position: relative;
  z-index: 1;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.roadmap-bar .bar-meta {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--fg-2);
  margin-left: auto;
  position: relative;
  z-index: 1;
}

.dep-line {
  position: absolute;
  pointer-events: none;
  stroke: var(--violet);
  stroke-width: 1;
  fill: none;
  stroke-dasharray: 2 3;
  opacity: 0.6;
}

.sprint-meta {
  display: flex;
  gap: 16px;
  margin-bottom: 16px;
  padding: 14px 16px;
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
}
.sprint-meta .item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sprint-meta .item .l {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.sprint-meta .item .v {
  font-size: 14px;
  font-weight: 500;
  font-feature-settings: "tnum";
}
.sprint-meta .divider { width: 1px; background: var(--line-faint); }

/* ============================================
   AI OPTIMIZATION
   ============================================ */
.opt-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 16px;
  height: calc(100vh - 180px);
}
.opt-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  padding-right: 4px;
}
.opt-card {
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 12px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.opt-card.active {
  border-color: var(--violet);
  background: var(--violet-fog);
  box-shadow: 0 0 0 1px var(--violet-glow);
}
.opt-card:hover { border-color: var(--line-strong); }
.opt-card .head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.opt-card .impact {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
}
.opt-card .title {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 4px;
}
.opt-card .desc {
  font-size: 11px;
  color: var(--fg-2);
  line-height: 1.5;
}

.opt-detail {
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-lg);
  padding: 22px;
  overflow-y: auto;
}
.opt-hero {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px dashed var(--line-faint);
  margin-bottom: 18px;
}
.opt-hero .icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--violet-fog);
  border: 1px solid var(--line-strong);
  color: var(--violet-hi);
}
.opt-hero h3 {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.opt-hero .sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-3);
  letter-spacing: 0.05em;
}

.opt-section {
  margin-bottom: 18px;
}
.opt-section h4 {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 10px;
}
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 32px 1fr;
  gap: 12px;
  align-items: center;
}
.compare-col {
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 12px;
}
.compare-col.before { border-style: dashed; opacity: 0.7; }
.compare-col.after { border-color: var(--violet); background: var(--violet-fog); }
.compare-col .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-3);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.compare-col .item {
  font-size: 12px;
  padding: 6px 8px;
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: 4px;
  margin-bottom: 4px;
}
.compare-arrow {
  color: var(--violet-hi);
  text-align: center;
  font-size: 18px;
}

.opt-actions {
  display: flex;
  gap: 8px;
  padding-top: 16px;
  border-top: 1px dashed var(--line-faint);
}

/* ============================================
   SETTINGS
   ============================================ */
.settings-grid {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 24px;
}
.settings-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.settings-nav button {
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  color: var(--fg-2);
  padding: 8px 10px;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
}
.settings-nav button:hover { background: var(--bg-2); color: var(--fg-0); }
.settings-nav button.active {
  background: var(--violet-fog);
  color: var(--fg-0);
  border-color: var(--line-strong);
}

.setting-row {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 24px;
  padding: 18px 0;
  border-bottom: 1px dashed var(--line-faint);
  align-items: center;
}
.setting-row .label { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.setting-row .desc { font-size: 12px; color: var(--fg-2); }
.setting-row .control { justify-self: end; }

/* Adaptive learning chart */
.adapt-chart {
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 16px;
  position: relative;
}
.pattern-bar {
  display: grid;
  grid-template-columns: 80px 1fr 50px;
  gap: 12px;
  align-items: center;
  padding: 6px 0;
}
.pattern-bar .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.pattern-bar .b {
  height: 6px;
  background: var(--bg-2);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.pattern-bar .b > div {
  height: 100%;
  background: linear-gradient(90deg, var(--violet), var(--cyan));
  border-radius: 3px;
}
.pattern-bar .v {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-1);
  text-align: right;
  font-feature-settings: "tnum";
}

/* Toggle switch */
.toggle {
  display: inline-block;
  width: 36px;
  height: 20px;
  background: var(--bg-3);
  border: 1px solid var(--line-faint);
  border-radius: 999px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--fg-2);
  transition: all 0.2s;
}
.toggle.on {
  background: var(--violet);
  border-color: var(--violet-hi);
}
.toggle.on::after {
  left: 18px;
  background: white;
  box-shadow: 0 0 8px var(--violet-glow);
}

.seg {
  display: inline-flex;
  background: var(--bg-2);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 2px;
}
.seg button {
  background: transparent;
  border: none;
  color: var(--fg-3);
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.seg button.active {
  background: var(--violet-fog);
  color: var(--fg-0);
}

/* ============================================
   SCROLLBARS
   ============================================ */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--bg-3);
  border-radius: 5px;
  border: 2px solid var(--bg-0);
}
::-webkit-scrollbar-thumb:hover { background: var(--line); }

/* ============================================
   ANIMATIONS
   ============================================ */

/* card-lift: scale up + deeper shadow on drag hover */
@keyframes card-lift {
  0% { transform: translateY(-1px) scale(1); box-shadow: 0 4px 12px oklch(0 0 0 / 0.3); }
  100% { transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 32px oklch(0 0 0 / 0.55), 0 0 0 1px var(--violet-glow); }
}

/* skeleton-pulse: gradient sweep for loading states */
@keyframes skeleton-pulse {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.skeleton {
  background: linear-gradient(90deg, var(--bg-2) 25%, var(--bg-3) 50%, var(--bg-2) 75%);
  background-size: 200% 100%;
  animation: skeleton-pulse 1.4s ease infinite;
  border-radius: var(--r-sm);
}

/* ripple: circular expanding ripple from button click center */
@keyframes ripple {
  0% { transform: scale(0); opacity: 0.45; }
  100% { transform: scale(4); opacity: 0; }
}
.btn-ripple {
  position: relative;
  overflow: hidden;
}
.btn-ripple .ripple-circle {
  position: absolute;
  border-radius: 50%;
  background: white;
  pointer-events: none;
  animation: ripple 0.5s ease-out forwards;
  width: 60px;
  height: 60px;
  margin-left: -30px;
  margin-top: -30px;
}

/* stagger-in: cascading entry for list items */
@keyframes stagger-in {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.stagger-item {
  animation: stagger-in 0.38s var(--ease-out) both;
}

/* column-accept: brief glow pulse when a column accepts a dropped card */
@keyframes column-accept {
  0% { box-shadow: 0 0 0 0 var(--violet-glow); }
  50% { box-shadow: 0 0 0 6px var(--violet-glow), inset 0 0 20px var(--violet-fog); }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.kb-col.accepted {
  animation: column-accept 0.55s var(--ease-out) both;
}

/* task-complete: strikethrough + fade when task moved to done */
@keyframes task-complete {
  0% { opacity: 1; }
  40% { text-decoration: line-through; text-decoration-color: var(--green); }
  100% { opacity: 0.55; text-decoration: line-through; color: var(--fg-3); }
}
.kb-card.completing {
  animation: task-complete 0.6s var(--ease-out) forwards;
}

/* toast-slide: slide in from bottom-right for success/error toasts */
@keyframes toast-slide {
  from { transform: translateX(120%) translateY(0); opacity: 0; }
  to { transform: translateX(0) translateY(0); opacity: 1; }
}
@keyframes toast-fade-out {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(120%); opacity: 0; }
}
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--surface-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px 16px;
  min-width: 260px;
  max-width: 380px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  box-shadow: 0 8px 24px oklch(0 0 0 / 0.4);
  backdrop-filter: blur(12px);
  animation: toast-slide 0.35s var(--ease-out) both;
  pointer-events: auto;
}
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--rose); }
.toast.info { border-color: var(--violet); }
.toast.leaving { animation: toast-fade-out 0.3s var(--ease-out) forwards; }

/* shake: horizontal shake for form validation errors */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.shake {
  animation: shake 0.4s ease both;
}

@keyframes pulse-ring {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.6); opacity: 0; }
}
.pulse {
  position: relative;
}
.pulse::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 1px solid var(--violet);
  animation: pulse-ring 2s ease-out infinite;
  pointer-events: none;
}

.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 3px; height: 3px;
  background: var(--violet);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--violet);
  animation: drift 6s linear infinite;
}
@keyframes drift {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translate(var(--dx, 60px), var(--dy, -60px)); opacity: 0; }
}


/* ============================================
   LOGIN
   ============================================ */
.login-wrap {

.login-field {

}
.login-field label {

.login-field input {

}

}
.login-submit {

}
.login-divider {

}
.login-divider::before,
.login-divider::after {

}
.login-sso {
  width: 100%; padding: 11px;

  font-size: 13px;
}
.login-links {
  display: flex; justify-content: space-between;
  margin-top: 20px;

  color: var(--fg-3);
}
.login-links a {

}
.login-links a:hover { text-decoration: underline; }

.login-toolbar {
  margin-top: 24px;
  display: flex; align-items: center; gap: 16px;
}

.login-scan {
  padding: 4px 0;
}
.scan-trace {
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  padding: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  display: flex; flex-direction: column; gap: 8px;
  margin-bottom: 16px;
  min-height: 140px;
}
.scan-trace .line {
  display: flex; align-items: center; gap: 8px;
  opacity: 0;
  animation: scan-in 0.3s ease forwards;
  color: var(--fg-1);
}
.scan-trace .ts { color: var(--fg-3); }
.scan-trace .tag {
  padding: 1px 6px; border-radius: 3px;
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase;
}
.scan-trace .tag.ok { background: var(--green-fog); color: var(--green); border: 1px solid var(--green); }
.scan-trace .tag.detect { background: var(--violet-fog); color: var(--violet-hi); border: 1px solid var(--violet); }
@keyframes scan-in {
  to { opacity: 1; }
}
.scan-bar {
  height: 3px; border-radius: 2px;
  background: var(--bg-1);
  overflow: hidden;
  position: relative;
}
.scan-bar > div {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--violet), transparent);
  width: 40%;
  animation: scan-sweep 1.5s ease-in-out infinite;
}
@keyframes scan-sweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

  border-radius: 4px;
  border: 1.5px solid var(--line);
  display: grid; place-items: center;
  cursor: pointer;
  flex-shrink: 0;
}
.kb-check.on {
  background: var(--violet);
  border-color: var(--violet);
  color: white;
}
.kb-comment-input {
  display: flex; align-items: center; gap: 10px;
  padding: 10px;
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-md);
  margin-bottom: 12px;
}
.kb-comment-input input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--fg-0);
  font-family: var(--font-sans);
  font-size: 13px;
  outline: none;
}
.kb-comment {
  display: flex; gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--line-faint);
}
.kb-comment-body { flex: 1; }
.kb-ai-callout {
  padding: 14px;
  margin-bottom: 22px;
  background: var(--violet-fog);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
}
.kb-side-row {
  display: flex; flex-direction: column; gap: 6px;
}
.kb-side-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.kb-side-assignees {
  display: flex; flex-direction: column; gap: 4px;
}
.kb-side-user {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 8px;
  background: var(--bg-1);
  border: 1px solid var(--line-faint);
  border-radius: var(--r-sm);
  font-size: 12px;
}
.kb-add-assignee {
  background: transparent;
  border: 1px dashed var(--line-faint);
  border-radius: 50%;
  width: 24px; height: 24px;
  cursor: pointer;
  display: grid; place-items: center;
  padding: 0;
}
.kb-add-assignee:hover { border-color: var(--violet); }

async function ensureProfile(user) {
  if (!user?.id) return null;
  const fallbackName = user.user_metadata?.name || user.email?.split("@")[0] || "Usuario";
  const { data: existing, error: readError } = await supabase
    .from("profiles")
    .select("id,name,color")
    .eq("id", user.id)
    .maybeSingle();
  if (readError) console.warn("Profile read warning:", readError.message);
  if (existing) return existing;

  const { data, error } = await supabase
    .from("profiles")
    .insert({ id: user.id, name: fallbackName, color: "violet" })
    .select("id,name,color")
    .maybeSingle();
  if (error) {
    console.warn("Profile bootstrap warning:", error.message);
    return { id: user.id, name: fallbackName, color: "violet" };
  }
  return data;
}

function userFromSessionUser(user, profile = null) {
  if (!user) return null;
  const name = profile?.name || user.user_metadata?.name || user.email?.split("@")[0] || "Usuario";
  return { id: user.id, email: user.email, name };
}

function humanSupabaseError(error, fallback = "No se pudo completar la operación") {
  if (!error) return fallback;
  return error.message || error.details || fallback;
}

function readJsonStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (_) {
    return fallback;
  }
}

function writeJsonStore(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
}

  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function Sparkline({ values, color = "var(--violet)" }) {
  const w = 180, h = 36;
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / span) * h;
    return `${x},${y}`;
  }).join(" ");
  return (
    <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id={`sp-${color.replace(/[()\s,]/g,'')}`} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.4"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round"/>
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#sp-${color.replace(/[()\s,]/g,'')})`}/>
    </svg>
  );
}

const ROUTINE_STORAGE_KEY = "quark_routine_v1";

function loadRoutineState(lang) {
  try {

      };

function Dashboard({ t, lang, tasks = [], onOpenBoard, onOpenOptimize }) {
  const insights = QTd.INSIGHTS[lang === "es" ? "es" : "en"];
  const [routine, setRoutine] = useState(() => loadRoutineState(lang));
  const [routineTab, setRoutineTab] = useState("today");
  const [newTitle, setNewTitle] = useState("");
  const [newWhen, setNewWhen] = useState("tomorrow");
  const [newTime, setNewTime] = useState("30m");

  useEffect(() => {
    try {
      localStorage.setItem(ROUTINE_STORAGE_KEY, JSON.stringify(routine));
    } catch (_) {}
  }, [routine]);

  // Real metrics derived from Supabase tasks
  const realMetrics = useMemo(() => {
    if (!tasks || tasks.length === 0) return null;
    const total = tasks.length;
    const byStatus = {};
    const byPrio = {};
    tasks.forEach(tk => {
      byStatus[tk.status] = (byStatus[tk.status] || 0) + 1;
      byPrio[tk.priority] = (byPrio[tk.priority] || 0) + 1;
    });
    const doneCount = byStatus['done'] || 0;
    const doingCount = byStatus['doing'] || 0;
    const blockedCount = tasks.filter(tk => tk.stuck).length;
    const stuckCount = tasks.filter(tk => tk.stuck).length;
    const projects = [...new Set(tasks.map(tk => tk.project_name).filter(Boolean))];
    const today = new Date().toISOString().slice(0, 10);
    const overdueCount = tasks.filter(tk => tk.due && tk.due < today && tk.status !== 'done').length;
    // Recent activity: sort by updated_at, last 5
    const recent = [...tasks]
      .filter(tk => tk.updated_at)
      .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
      .slice(0, 5);
    const completionPct = total ? Math.round((doneCount / total) * 100) : 0;
    return { total, byStatus, byPrio, doneCount, doingCount, blockedCount, stuckCount, projects, overdueCount, recent, completionPct };
  }, [tasks]);

  const { routineTodayPct, combinedProgress, projAvgPct, doneToday, totalToday } = useMemo(() => {
    const day = routine.today || [];
    const totalT = day.length;
    const doneT = day.filter(x => x.done).length;
    const rp = totalT ? Math.round((doneT / totalT) * 100) : 0;
    const pAvg = realMetrics ? realMetrics.completionPct / 100 : (QTd.PROJECTS.reduce((a, p) => a + p.progress, 0) / QTd.PROJECTS.length);
    const pp = Math.round(pAvg * 100);
    const combined = Math.round((rp + pp) / 2);
    return { routineTodayPct: rp, combinedProgress: combined, projAvgPct: pp, doneToday: doneT, totalToday: totalT };
  }, [routine.today]);

  const list = routineTab === "today" ? routine.today : routine.tomorrow;

  const toggleDone = (id, slot) => {
    setRoutine(r => ({
      ...r,
      [slot]: r[slot].map(it => it.id === id ? { ...it, done: !it.done } : it),
    }));
  };

  const moveToToday = (id) => {
    setRoutine(r => {
      const item = r.tomorrow.find(x => x.id === id);
      if (!item) return r;
      return {
        today: [...r.today, { ...item, done: false }],
        tomorrow: r.tomorrow.filter(x => x.id !== id),
      };
    });

  };

    if (!newTitle.trim()) return;

      id: `r-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,

      prio: lang === "es" ? "media" : "med",
      cat: lang === "es" ? "Rutina" : "Routine",
      done: false,
    };
    setRoutine(r => ({ ...r, [slot]: [...r[slot], item] }));
    setNewTitle("");
  };

  const prioPill = (p) => (p === "alta" || p === "high" || p === "p0" ? "rose" : "amber");

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{t.dash_title} <em>{t.dash_em}</em></h1>
          <p>{t.dash_sub}</p>

                const progress = projTasks.length ? done / projTasks.length : 0;
                const colors = ["violet", "cyan", "amber", "rose", "green", "violet"];
                const color = colors[i % colors.length];
                return (
                  <div key={projName} className="proj-row stagger-item" onClick={() => onOpenBoard && onOpenBoard(projName)} style={{animationDelay: `${i * 0.04}s`}}>
                    <div className="proj-icon" style={{

                      borderColor: `var(--line-strong)`,

                    <div className="proj-name">

            : QTd.PROJECTS.map((p, i) => (

                  <span className={`pill ${tk.status === 'done' ? 'green' : tk.status === 'doing' ? 'violet' : tk.status === 'review' ? 'amber' : ''}`} style={{flexShrink: 0}}>{tk.status}</span>

                  <span style={{fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--fg-3)", flexShrink: 0}}>{tk.project_name}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Routine: today / tomorrow — today always available */}
        <div className="card dash-col-5" style={{gridColumn: "span 5"}}>
          <div className="card-head" style={{marginBottom: 8}}>
            <div className="card-title">
              <span className="dot" style={{background: "var(--amber)", boxShadow: "0 0 8px var(--amber)"}}></span>

          <div className="routine-progress-top">
            <div className="routine-ring" style={{ "--p": routineTodayPct }}>

            <div>
              <div style={{fontSize: 13, fontWeight: 600, color: "var(--fg-0)"}}>
                <span style={{display: "inline-flex", verticalAlign: "middle", marginRight: 6}}><IconD name="sun" size={14}/></span>
                {lang === "es" ? "Avance del día" : "Day progress"}

              <div style={{fontSize: 12, color: "var(--fg-2)", marginTop: 4, lineHeight: 1.4}}>

                  ? `Tu rutina de hoy suma al ${t.m1_label.toLowerCase()} (mezcla con avance de proyectos).`

/* ============================================
   QUARK TASKING — Capture, Roadmap, Optimize, Settings
   ============================================ */

const useStateB = React.useState; const useEffectB = React.useEffect; const useRefB = React.useRef;
const QT2 = window.QT;
const IconS = QT2.Icon;

// ============================================
// CAPTURE
// ============================================
function Capture({ t, lang, currentUser }) {
  const [input, setInput] = useStateB("");
  const [running, setRunning] = useStateB(false);
  const [applying, setApplying] = useStateB(false);
  const [traceLines, setTraceLines] = useStateB([]);
  const [structVisible, setStructVisible] = useStateB(0);
  const traceData = QT2.CAPTURE_TRACE[lang];
  const resultData = QT2.CAPTURE_RESULT[lang];
  const traceEnd = useRefB(null);
  const timersRef = useRefB([]);

  const clearTimers = () => {
    timersRef.current.forEach(clearTimeout);
    timersRef.current = [];
  };

  useEffectB(() => () => clearTimers(), []);

  const run = () => {
    if (!input.trim() || running) return;
    setRunning(true);
    setTraceLines([]);
    setStructVisible(0);
    clearTimers();

    traceData.forEach((line, i) => {
      const t1 = setTimeout(() => {
        setTraceLines(prev => [...prev, line]);
      }, 200 + i * 360);
      timersRef.current.push(t1);
    });

    resultData.forEach((_, i) => {
      const t2 = setTimeout(() => {
        setStructVisible(v => v + 1);
      }, 200 + traceData.length * 360 + i * 280);
      timersRef.current.push(t2);
    });

    const tEnd = setTimeout(() => setRunning(false),
      200 + traceData.length * 360 + resultData.length * 280 + 200);
    timersRef.current.push(tEnd);
  };

  const loadSample = () => {
    setInput(QT2.CAPTURE_SAMPLE[lang]);
  };

  const clear = () => {
    setInput("");
    setTraceLines([]);
    setStructVisible(0);
    clearTimers();
    setRunning(false);
    setApplying(false);
  };

  const applyToWorkspace = async () => {
    if (applying || structVisible !== resultData.length) return;
    setApplying(true);
    try {
      const { data: userData, error: userError } = await supabase.auth.getUser();
      if (userError) throw userError;
      const uid = userData?.user?.id || currentUser?.id;
      if (!uid) throw new Error(lang === "es" ? "Debes iniciar sesión para crear tareas." : "You must sign in to create tasks.");

      const rows = [];
      resultData.forEach((project) => {
        const projectName = String(project.name || "Quark").split("·")[0].trim() || "Quark";
        (project.tasks || []).forEach((task) => {
          const pills = task.pills || [];
          const priorityPill = pills.find((p) => ["p0", "alta", "high", "media", "med", "baja", "low"].includes(String(p.k).toLowerCase()));
          const priorityMap = { alta: "high", high: "high", media: "med", med: "med", baja: "low", low: "low", p0: "p0" };
          const priority = priorityMap[String(priorityPill?.k || "med").toLowerCase()] || "med";
          const tags = pills
            .map((p) => String(p.k || "").trim())
            .filter((k) => k && !["p0", "alta", "high", "media", "med", "baja", "low"].includes(k.toLowerCase()) && !/^\d+h$|^\d+m$|^\d+min$|^\d+\s?m$/i.test(k));
          rows.push({
            title: task.t,
            project_name: projectName,
            status: "backlog",
            priority,
            tags,
            created_by: uid,
            ai_note: lang === "es" ? "Creada desde Capturar" : "Created from Capture",
          });
        });
      });

      const { error } = await supabase.from("tasks").insert(rows);
      if (error) throw error;
      alert(lang === "es" ? `${rows.length} tareas creadas en el workspace.` : `${rows.length} tasks created in the workspace.`);
    } catch (err) {
      console.error("Apply capture error:", err);
      alert(humanSupabaseError(err, lang === "es" ? "No se pudieron crear las tareas." : "Could not create tasks."));
    } finally {
      setApplying(false);
    }
  };

  const refineStructure = () => {
    const summary = resultData.map(project => {
      const tasks = (project.tasks || []).map(task => `- ${task.t} [${(task.pills || []).map(p => p.k).join(", ")}]`).join("\n");
      return `${project.name}\n${tasks}`;
    }).join("\n\n");
    setInput(`${input.trim()}\n\nRefinar esta estructura:\n${summary}`.trim());
    setTraceLines([]);
    setStructVisible(0);
    setRunning(false);
  };

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{t.cap_title} <em>{t.cap_em}</em></h1>
          <p>{t.cap_sub}</p>
        </div>
      </div>

      <div className="capture-wrap">
        <div className="capture-input">
          <textarea
            className="capture-textarea"
            placeholder={t.cap_placeholder}
            value={input}
            onChange={e => setInput(e.target.value)}
          />
          <div style={{display: "flex", gap: 8}}>
            <button className="btn btn-primary" onClick={run} disabled={running || !input.trim()}>
              <IconS name={running ? "pause" : "sparkle"} size={14}/>
              {running ? t.cap_running : t.cap_run}
            </button>
            <button className="btn" onClick={loadSample}>
              <IconS name="capture" size={14}/>
              {t.cap_sample}
            </button>
            <button className="btn btn-ghost" onClick={clear}>{t.cap_clear}</button>
          </div>
        </div>

        <div className="capture-output">
          {traceLines.length === 0 && structVisible === 0 ? (
            <div style={{
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              height: "100%",
              color: "var(--fg-3)",
              gap: 12,
              textAlign: "center"
            }}>
              <div style={{
                width: 72, height: 72, borderRadius: "50%",
                background: "radial-gradient(circle, var(--violet-fog), transparent 70%)",
                border: "1px dashed var(--line)",
                display: "grid", placeItems: "center"
              }}>
                <IconS name="brain" size={28}/>
              </div>
              <div style={{fontSize: 14, color: "var(--fg-1)"}}>{t.cap_output_empty}</div>
              <div style={{fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.05em"}}>{t.cap_output_empty_sub}</div>
            </div>
          ) : (
            <>
              <div className="card-head" style={{marginBottom: 10}}>
                <div className="card-title"><span className="dot"></span>{t.cap_trace_title}</div>
                <div className="card-sub">{traceLines.length}/{traceData.length}</div>
              </div>
              <div className="thinking-trace">
                {traceLines.map((line, i) => (
                  <div key={i} className="line">
                    <span className="ts">[{String(i * 0.4).padStart(4, "0").slice(0,4)}s]</span>
                    <span className={`tag ${line.tag}`}>{line.tag}</span>
                    <span>{line.text}</span>
                  </div>
                ))}
                {running && traceLines.length < traceData.length && <span className="cursor"></span>}
                <div ref={traceEnd}/>
              </div>

              {structVisible > 0 && (
                <>
                  <div className="card-head" style={{marginTop: 18, marginBottom: 10}}>
                    <div className="card-title"><span className="dot"></span>{t.cap_struct_title}</div>
                  </div>
                  {resultData.slice(0, structVisible).map((proj, i) => (
                    <div key={i} className="struct-project" style={{animationDelay: `${i * 0.05}s`}}>
                      <div className="struct-project-head">
                        <IconS name="dashboard" size={14}/>
                        <div className="name">{proj.name}</div>
                        <div className="meta">
                          <span className="card-sub">{proj.meta}</span>
                        </div>
                      </div>
                      {proj.tasks.map((task, ti) => (
                        <div key={ti} className="struct-task">
                          <div className="check"></div>
                          <div>{task.t}</div>
                          <div className="pills">
                            {task.pills.map((p, pi) => (
                              <span key={pi} className={`pill ${p.c}`}>{p.k}</span>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                  {!running && structVisible === resultData.length && (
                    <div style={{display: "flex", gap: 8, marginTop: 12}}>
                      <button className="btn btn-primary" onClick={applyToWorkspace} disabled={applying}>
                        <IconS name="check" size={14}/>{applying ? (lang === "es" ? "Aplicando…" : "Applying…") : t.cap_apply}
                      </button>
                      <button className="btn" onClick={refineStructure}><IconS name="settings" size={14}/>{t.cap_edit}</button>
                    </div>
                  )}
                </>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================
// ROADMAP
// ============================================
function Roadmap({ t, lang }) {
  const data = QT2.ROADMAP.es; // labels are short enough to share
  const weekLabels = lang === "es"
    ? ["S15", "S16", "S17", "S18", "AHORA", "S20", "S21", "S22"]
    : ["W15", "W16", "W17", "W18", "NOW", "W20", "W21", "W22"];
  const nowIdx = 4;
  const [selectedBar, setSelectedBar] = useStateB(null);
  const [zoom, setZoom] = useStateB(1);
  const selected = selectedBar ? data.flatMap(row => row.bars.map(bar => ({...bar, lane: row.lane}))).find(bar => `${bar.lane}-${bar.t}` === selectedBar) : null;

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{t.rm_title} <em>{t.rm_em}</em></h1>
          <p>{t.rm_sub}</p>
        </div>
      </div>

      <div className="sprint-meta">
        <div className="item">
          <div className="l">{t.rm_sprint.toUpperCase()}</div>
          <div className="v">14 / 20 quarks</div>
        </div>
        <div className="divider"/>
        <div className="item">
          <div className="l">{t.rm_capacity}</div>
          <div className="v">31 / 36 pts</div>
        </div>
        <div className="divider"/>
        <div className="item">
          <div className="l">{t.rm_velocity}</div>
          <div className="v" style={{color: "var(--cyan)"}}>27 pts</div>
        </div>
        <div className="divider"/>
        <div className="item">
          <div className="l">{t.rm_risk}</div>
          <div className="v" style={{color: "var(--amber)"}}>22%</div>
        </div>
        <div className="divider"/>
        <div className="item">
          <div className="l">{t.rm_focus}</div>
          <div className="v">Atlas onboarding</div>
        </div>
      </div>

      <div style={{display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 10}}>
        <button className="btn" onClick={() => setZoom(z => Math.max(0.75, +(z - 0.25).toFixed(2)))}>{t.rm_zoom} −</button>
        <button className="btn" onClick={() => setZoom(z => Math.min(1.5, +(z + 0.25).toFixed(2)))}>{t.rm_zoom} +</button>
        {selected && <span className="pill violet"><span className="dot"></span>{selected.lane}: {selected.t} · {selected.p}%</span>}
      </div>

      <div className="roadmap" style={{transform: `scale(${zoom})`, transformOrigin: "top left", width: `${100 / zoom}%`}}>
        <div className="roadmap-header">
          <div>LANE</div>
          {weekLabels.map((w, i) => (
            <div key={i} className={i === nowIdx ? "now" : ""}>{w}</div>
          ))}
        </div>
        {data.map((row, ri) => (
          <div key={ri} className="roadmap-row">
            <div className="roadmap-label">
              <IconS name="dashboard" size={14}/>
              <div>
                <div>{row.lane}</div>
                <small>{row.sub}</small>
              </div>
            </div>
            {Array.from({length: 8}).map((_, ci) => (
              <div key={ci} className="roadmap-cell"/>
            ))}
            {row.bars.map((bar, bi) => {
              const cellW = `calc((100% - 220px) / 8)`;
              const left = `calc(220px + ${cellW} * ${bar.start})`;
              const width = `calc(${cellW} * ${bar.span} - 4px)`;
              return (
                <div key={bi} className={`roadmap-bar ${bar.c}`}
                  onClick={() => setSelectedBar(`${row.lane}-${bar.t}`)}
                  title={`${row.lane}: ${bar.t} · ${bar.p}%`}
                  style={{ left, width, "--p": `${bar.p}%`, cursor: "pointer", outline: selectedBar === `${row.lane}-${bar.t}` ? "2px solid var(--violet-hi)" : "none" }}>
                  <div className="progress"/>
                  <span className="bar-label">{bar.t}</span>
                  <span className="bar-meta">{bar.p}%</span>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}
