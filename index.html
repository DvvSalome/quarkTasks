function Optimize({ t, lang, initialIndex = null }) {
  const proposals = QT2.OPT_PROPOSALS[lang];
  const [dismissed, setDismissed] = useStateB(() => readJsonStore("quark_opt_dismissed_v1", []));
  const [applied, setApplied] = useStateB(() => readJsonStore("quark_opt_applied_v1", []));
  const visibleProposals = proposals.filter(p => !dismissed.includes(p.id));
  const [active, setActive] = useStateB(visibleProposals[Math.min(initialIndex ?? 0, visibleProposals.length - 1)]?.id || proposals[0].id);
  useEffectB(() => { if (initialIndex != null && visibleProposals[initialIndex]) setActive(visibleProposals[initialIndex].id); }, [initialIndex]);
  const sel = visibleProposals.find(p => p.id === active) || visibleProposals[0] || proposals[0];

  const applyProposal = () => {
    const next = Array.from(new Set([...applied, sel.id]));
    setApplied(next);
    writeJsonStore("quark_opt_applied_v1", next);
    alert(lang === "es" ? "Propuesta aplicada al plan local." : "Proposal applied to the local plan.");
  };
  const simulateProposal = () => {
    alert(lang === "es"
      ? `Simulación: ${sel.title} reduce riesgo y mejora foco sin cambiar datos reales.`
      : `Simulation: ${sel.title} reduces risk and improves focus without changing real data.`);
  };
  const dismissProposal = () => {
    const next = Array.from(new Set([...dismissed, sel.id]));
    setDismissed(next);
    writeJsonStore("quark_opt_dismissed_v1", next);
    const remaining = proposals.filter(p => !next.includes(p.id));
    setActive(remaining[0]?.id || proposals[0].id);
  };

  const beforeAfterMap = {
    o1: {
      before: ["#142 · Auth refresh token", "#156 · Renew oauth token", "#189 · Token expiry handler"],
      after: ["AUTH-01 · Refresh flow (3 subtareas / subtasks)"]
    },
    o2: {
      before: ["1. Pavo gateway impl", "2. Spec + scope Pavo", "3. QA gateway"],
      after: ["1. Spec + scope Pavo", "2. Pavo gateway impl", "3. QA gateway"]
    },
    o3: {
      before: ["EPIC v0.5 release (sin desglose / no breakdown)"],
      after: ["1. Tokens oklch", "2. Onboarding step 3", "3. OAuth refresh", "4. API pagination", "5. QA + ship"]
    },
    o4: {
      before: ["Bug #233 · prio media · backlog", "4 tareas bloqueadas downstream"],
      after: ["Bug #233 · P0 · esta semana / this week", "4 tareas desbloqueadas / 4 tasks unblocked"]
    },
    o5: {
      before: ["Deep work: distribuido / scattered", "Foco: 38%"],
      after: ["Deep work: 09:00–12:00 Mar+Jue / Tue+Thu", "Foco: 60%"]
    }
  };
  const ba = beforeAfterMap[sel.id];

  const why = {
    es: {
      o1: "Tres quarks describen el mismo trabajo de auth. Mantenerlos separados duplica el esfuerzo de PR review, QA y deploy. Una unidad con 3 subtareas conserva trazabilidad sin fricción operativa.",
      o2: "El grafo de dependencias indica que \"Pavo gateway impl\" requiere \"Spec + scope\" como input. Su orden actual genera un bloqueo garantizado en mitad de sprint.",
      o3: "Epics sin subtareas medibles tienen 3.4× más probabilidad de slip según tu histórico. Cinco quarks con criterios claros es la granularidad óptima para tu equipo.",
      o4: "Un quick win con razón impacto/esfuerzo > 4× debería ejecutarse antes que tareas de mayor esfuerzo. Esto desbloquea capacidad downstream esta misma semana.",
      o5: "Tu firma operativa muestra +32% de output entre 09:00 y 12:00. Reagrupar deep work en esa franja podría ahorrar ~6h/semana de trabajo fragmentado."
    },
    en: {
      o1: "Three quarks describe the same auth work. Keeping them split duplicates PR review, QA and deploy effort. One unit with 3 subtasks preserves traceability without operational friction.",
      o2: "The dependency graph shows \"Pavo gateway impl\" requires \"Spec + scope\" as input. Current order guarantees a mid-sprint block.",
      o3: "Epics without measurable subtasks have 3.4× higher slip probability based on your history. Five quarks with clear criteria is your team's optimal granularity.",
      o4: "A quick win with impact/effort > 4× should run before higher-effort tasks. This frees downstream capacity this same week.",
      o5: "Your operational signature shows +32% output between 09:00 and 12:00. Re-grouping deep work in that slot could save ~6h/week of fragmented work."
    }
  }[lang];

  return (
    <div className="page">
      <div className="page-head">
        <div>
          <h1>{t.opt_title} <em>{t.opt_em}</em></h1>
          <p>{t.opt_sub}</p>
        </div>
        <div className="meta" style={{display: "flex", alignItems: "center", gap: 8}}>
          <span className="pill violet">
            <span className="dot"></span>
            {visibleProposals.length} {lang === "es" ? "propuestas" : "proposals"}
          </span>
        </div>
      </div>

      <div className="opt-grid">
        <div className="opt-list">
          {visibleProposals.map(p => (
            <div key={p.id}
              className={`opt-card ${active === p.id ? "active" : ""}`}
              onClick={() => setActive(p.id)}>
              <div className="head">
                <div className={`insight-icon ${p.kind === "default" ? "" : p.kind}`} style={{width: 22, height: 22, borderRadius: 6}}>
                  <IconS name={p.icon} size={12}/>
                </div>
                <span className="card-sub">{p.id.toUpperCase()}</span>
                <span className="impact">{p.impact}</span>
              </div>
              <div className="title">{p.title}</div>
              <div className="desc">{p.desc}</div>
            </div>
          ))}
        </div>

        <div className="opt-detail">
          <div className="opt-hero">
            <div className="icon"><IconS name={sel.icon} size={22}/></div>
            <div>
              <h3>{sel.title}</h3>
              <div className="sub">{sel.id.toUpperCase()} · {lang === "es" ? "IMPACTO" : "IMPACT"} {sel.impact}</div>
            </div>
            <div style={{display: "flex", gap: 8}}>
              <button className="btn btn-primary" onClick={applyProposal}><IconS name="check" size={14}/>{applied.includes(sel.id) ? (lang === "es" ? "Aplicada" : "Applied") : t.opt_apply}</button>
              <button className="btn" onClick={simulateProposal}>{t.opt_simulate}</button>
            </div>
          </div>

          <div className="opt-section">
            <h4>{t.opt_why}</h4>
            <p style={{fontSize: 13, color: "var(--fg-1)", lineHeight: 1.6, maxWidth: "70ch"}}>
              {why[sel.id]}
            </p>
          </div>

          <div className="opt-section">
            <h4>{lang === "es" ? "Antes / Después" : "Before / After"}</h4>
            <div className="compare-grid">
              <div className="compare-col before">
                <div className="lbl">{t.opt_before}</div>
                {ba.before.map((it, i) => <div key={i} className="item">{it}</div>)}
              </div>
              <div className="compare-arrow"><IconS name="arrow" size={20}/></div>
              <div className="compare-col after">
                <div className="lbl">{t.opt_after}</div>
                {ba.after.map((it, i) => <div key={i} className="item">{it}</div>)}
              </div>
            </div>
          </div>

          <div className="opt-section">
            <h4>{t.opt_metrics}</h4>
            <div style={{display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10}}>
              {[
                { l: lang === "es" ? "Tiempo ahorrado" : "Time saved", v: "+4.2h", c: "var(--green)" },
                { l: lang === "es" ? "Riesgo" : "Risk", v: "−18%", c: "var(--cyan)" },
                { l: lang === "es" ? "Tareas afectadas" : "Affected tasks", v: "9", c: "var(--violet-hi)" },
                { l: lang === "es" ? "Confianza" : "Confidence", v: "0.91", c: "var(--fg-0)" },
              ].map((m, i) => (
                <div key={i} style={{
                  background: "var(--bg-2)",
                  border: "1px solid var(--line-faint)",
                  borderRadius: "var(--r-md)",
                  padding: "12px"
                }}>
                  <div style={{fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--fg-3)", letterSpacing: "0.1em", textTransform: "uppercase"}}>{m.l}</div>
                  <div style={{fontSize: 22, fontWeight: 500, color: m.c, marginTop: 4, fontFeatureSettings: '"tnum"'}}>{m.v}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="opt-actions">
            <button className="btn btn-primary" onClick={applyProposal}><IconS name="check" size={14}/>{applied.includes(sel.id) ? (lang === "es" ? "Aplicada" : "Applied") : t.opt_apply}</button>
            <button className="btn" onClick={simulateProposal}>{t.opt_simulate}</button>
            <button className="btn btn-ghost" onClick={dismissProposal}>{t.opt_dismiss}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Settings({ t, lang, theme, setTheme, density, setDensity, aiVerbose, setAiVerbose }) {
  const [tab, setTab] = useStateB("appearance");
  const [toggles, setToggles] = useStateB(() => readJsonStore("quark_settings_toggles_v1", { motion: true, autoReorg: true, duplicates: true, decomposition: true, smartNotifications: true, integrations: { GitHub: true, Slack: true, Linear: false, Calendar: true, Figma: false } }));
  const [integTokens, setIntegTokens] = useStateB(() => readJsonStore("quark_integrations", {}));
  const [integInputs, setIntegInputs] = useStateB({});
  const setToggle = (key, value) => {
    const next = { ...toggles, [key]: value };
    setToggles(next);
    writeJsonStore("quark_settings_toggles_v1", next);
  };
  const setIntegration = (name, value) => {
    const next = { ...toggles, integrations: { ...(toggles.integrations || {}), [name]: value } };
    setToggles(next);
    writeJsonStore("quark_settings_toggles_v1", next);
    if (!value) {
      // Remove token on disable
      const nextTokens = { ...integTokens };
      delete nextTokens[name];
      if (name === "GitHub") delete nextTokens.GitHubRepo;
      setIntegTokens(nextTokens);
      writeJsonStore("quark_integrations", nextTokens);
    }
  };
  const saveIntegToken = (name, token, extra) => {
    const nextTokens = { ...integTokens, [name]: token };
    if (extra) Object.assign(nextTokens, extra);
    setIntegTokens(nextTokens);
    writeJsonStore("quark_integrations", nextTokens);

                          <button className="btn btn-primary" style={{height:30,padding:"0 12px",fontSize:12,whiteSpace:"nowrap"}} onClick={() => {
                            const tok = (integInputs[it.n] ?? "").trim();
                            if (!tok) return;
                            const extra = {};
                            if (it.extra && integInputs[it.n + "_extra"]) extra[it.extra.key] = integInputs[it.n + "_extra"].trim();
                            saveIntegToken(it.n, tok, extra);
                            setIntegInputs(p => ({ ...p, [it.n]: "" }));
                          }}>
                            {lang === "es" ? "Guardar" : "Save"}
                          </button>
                          {hasToken && (
                            <button className="btn btn-ghost" style={{height:30,padding:"0 10px",fontSize:12}} onClick={() => {
                              const nextTokens = { ...integTokens };
                              delete nextTokens[it.n];
                              if (it.extra) delete nextTokens[it.extra.key];
                              setIntegTokens(nextTokens);
                              writeJsonStore("quark_integrations", nextTokens);
                            }}>✕</button>
                          )}
                        </div>
                        {it.extra && (
                          <input
                            type="text"
                            placeholder={it.extra.label + (it.extra.placeholder ? ` (${it.extra.placeholder})` : "")}
                            value={integInputs[it.n + "_extra"] ?? (integTokens[it.extra.key] || "")}
                            onChange={e => setIntegInputs(p => ({ ...p, [it.n + "_extra"]: e.target.value }))}
                            style={{background:"var(--bg-3)",border:"1px solid var(--line-strong)",borderRadius:"var(--r-sm)",padding:"5px 10px",fontSize:12,color:"var(--fg-1)",fontFamily:"var(--font-mono)",outline:"none"}}
                          />
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

  const [step, setStep] = useStateK("idle"); // idle | scanning | ok
  const [isSignUp, setIsSignUp] = useStateK(false);

  const t = lang === "es" ? {
    welcome: "Bienvenido a",
    sub: "Sistema operacional autónomo de organización de tareas. Tu workspace está esperando.",
    email: "Correo",
    pass: "Contraseña",
    enter: "Entrar al workspace",
    sso: "Continuar con SSO",
    forgot: "¿Olvidaste tu contraseña?",
    new: "¿Nuevo en Quark?",
    create: "Crear cuenta",
    badge: "Tu IA ha aprendido durante 47 días",
    scan1: "Verificando identidad…",
    scan2: "Cargando firma operativa…",
    scan3: "Sincronizando workspace híbrido…",
    scan4: "Listo. Iniciando…",
    placeholder_e: "tu@empresa.com",
    placeholder_p: "••••••••",
  } : {
    welcome: "Welcome to",
    sub: "Autonomous operational system for task organization. Your workspace is waiting.",
    email: "Email",
    pass: "Password",
    enter: "Enter workspace",
    sso: "Continue with SSO",
    forgot: "Forgot your password?",
    new: "New to Quark?",
    create: "Create account",
    badge: "Your AI has been learning for 47 days",
    scan1: "Verifying identity…",
    scan2: "Loading operational signature…",
    scan3: "Syncing hybrid workspace…",
    scan4: "Ready. Starting…",
    placeholder_e: "you@company.com",
    placeholder_p: "••••••••",
  };

  const submit = async (e) => {
    e && e.preventDefault();
    if (loading) return;
    setLoading(true);
    setStep("scanning");
    
    try {
      let data, error;
      if (isSignUp) {
        const res = await supabase.auth.signUp({
          email: email,
          password: pass
        });
        data = res.data; error = res.error;
      } else {
        const res = await supabase.auth.signInWithPassword({
          email: email,
          password: pass
        });
        data = res.data; error = res.error;
      }
      
      if (error) {
        console.error("Auth error:", error.message);
        setLoading(false);
        setStep("idle");
        alert(error.message);
        return;
      }
      if (isSignUp && !data.session) {
        setLoading(false);
        setStep("idle");
        alert(lang === "es"
          ? "Cuenta creada. Revisa tu correo para confirmar antes de entrar."
          : "Account created. Check your email to confirm before entering.");
        return;
      }
      
      // Simulate scanning steps
      setTimeout(() => setStep("ok"), 1800);
      setTimeout(async () => {
        const profile = await ensureProfile(data.user);
        onLogin(userFromSessionUser(data.user, profile));
      }, 2400);
    } catch (err) {
      console.error("Unexpected error:", err);
      setLoading(false);
      setStep("idle");
      alert("Error en la autenticación");
    }
  };

  const resetPassword = async (e) => {
    e.preventDefault();
    if (!email.trim()) {
      alert(lang === "es" ? "Escribe tu correo primero." : "Enter your email first.");
      return;
    }
    const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin });
    if (error) alert(error.message);
    else alert(lang === "es" ? "Te envié el enlace de recuperación." : "Password reset link sent.");
  };

  return (

        <div className="login-brand">

          <p>{t.sub}</p>

              {!isSignUp && (

function Avatar({ user, size = 22, ring = false }) {
  if (!user) return null;
  return (
    <div className="kb-avatar" style={{
      width: size, height: size,
      fontSize: Math.round(size * 0.4),
      background: `linear-gradient(135deg, var(--${user.color}), var(--violet))`,
      boxShadow: ring ? `0 0 0 2px var(--bg-1)` : "none"
    }} title={user.name}>{user.initials}</div>
  );
}

function AvatarStack({ ids, size = 22, max = 3, teammates = [] }) {
  const users = ids.map(id => teammates.find(u => u.id === id)).filter(Boolean);
  const shown = users.slice(0, max);
  const extra = users.length - shown.length;
  return (
    <div className="kb-avatar-stack">
      {shown.map((u, i) => <Avatar key={u.id} user={u} size={size} ring={true}/>)}
      {extra > 0 && (
        <div className="kb-avatar more" style={{width: size, height: size, fontSize: Math.round(size * 0.4)}}>+{extra}</div>
      )}
    </div>
  );
}

function AssignDropdown({ open, ids, onChange, onClose, teammates = [] }) {
  if (!open) return null;
  return (
    <div className="kb-assign-pop" onClick={e => e.stopPropagation()}>
      <div className="kb-assign-head">
        <span style={{fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.12em", color: "var(--fg-3)"}}>ASSIGN</span>
        <button className="btn-ghost" onClick={onClose} style={{background: "none", border: "none", color: "var(--fg-3)", cursor: "pointer", fontSize: 14}}>×</button>
      </div>
      {teammates.map(u => {
        const sel = ids.includes(u.id);
        return (
          <div key={u.id} className={`kb-assign-row ${sel ? "sel" : ""}`}
            onClick={() => onChange(sel ? ids.filter(x => x !== u.id) : [...ids, u.id])}>
            <Avatar user={u} size={22}/>
            <span>{u.name}</span>
            {sel && <span style={{marginLeft: "auto", color: "var(--violet-hi)"}}><IconK name="check" size={12}/></span>}
          </div>
        );
      })}
    </div>
  );
}

function KanbanCard({ card, onAssign, onClick, teammates = [], onDecompose, onPushGitHub }) {
  const [popOpen, setPopOpen] = useStateK(false);
  const prioColor = (p) => {
    if (p === "p0" || p === "alta" || p === "high") return "rose";
    if (p === "media" || p === "med") return "amber";
    return "";
  };
  return (
    <div className={`kb-card ${card.blocked ? "blocked" : ""} ${card.stuck ? "stuck" : ""}`}
      onClick={onClick}
      draggable
      onDragStart={(e) => {
        e.dataTransfer.setData("text/cardId", card.id);
        e.currentTarget.classList.add("dragging");
      }}
      onDragEnd={(e) => e.currentTarget.classList.remove("dragging")}>

      {card.blocked && (
        <div className="kb-card-banner blocked-banner">
          <IconK name="warn" size={11}/> {card.blockReason}
        </div>
      )}
      {card.stuck && (
        <div className="kb-card-banner stuck-banner">
          <IconK name="warn" size={11}/> {card.stuckDays}d {card.stuckDays === 1 ? "" : "+"} en review
        </div>
      )}
      {card.aiNote && (
        <div className="kb-card-banner ai-banner">
          <IconK name="sparkle" size={11}/> {card.aiNote}
        </div>
      )}

      <div className="kb-card-head">
        <span className="kb-card-code">{card.code}</span>
        <span className={`pill ${prioColor(card.prio)}`}><span className="dot"></span>{card.prio}</span>
      </div>

      <div className="kb-card-title">{card.title}</div>

      <div className="kb-card-tags">
        {(card.tags || []).map(tag => <span key={tag} className="kb-tag">#{tag}</span>)}
      </div>

      <div className="kb-card-foot">
        <div className="kb-card-meta">
          {card.checks && (
            <span className="kb-meta-item">
              <IconK name="check" size={11}/>
              <span>{card.checks.done}/{card.checks.total}</span>
            </span>
          )}
          {card.comments > 0 && (
            <span className="kb-meta-item">
              <IconK name="capture" size={11}/>
              <span>{card.comments}</span>
            </span>
          )}
          {card.due && (
            <span className={`kb-meta-item ${card.due === "hoy" || card.due === "today" ? "due-today" : ""}`}>
              <IconK name="bell" size={11}/>
              <span>{card.due}</span>
            </span>
          )}
        </div>
        <div className="kb-card-assignees" onClick={(e) => { e.stopPropagation(); setPopOpen(o => !o); }}>
          {card.assignee.length === 0 ? (
            <div className="kb-avatar empty" title="Asignar">+</div>
          ) : (
            <AvatarStack ids={card.assignee} size={22} teammates={teammates}/>
          )}
          <AssignDropdown
            open={popOpen}
            ids={card.assignee}
            onChange={(ids) => onAssign(card.id, ids)}
            onClose={() => setPopOpen(false)}
            teammates={teammates}/>
        </div>
      </div>

      {card.checks && (
        <div className="kb-card-progress">
          <div style={{width: `${(card.checks.done / card.checks.total) * 100}%`}}/>
        </div>
      )}

      {(onDecompose || onPushGitHub) && (
        <div className="kb-card-actions" onClick={e => e.stopPropagation()} style={{display:"flex",gap:4,marginTop:6,paddingTop:6,borderTop:"1px solid var(--line-faint)"}}>
          {onDecompose && (
            <button className="btn btn-ghost" style={{padding:"2px 7px",fontSize:10,height:22,borderRadius:4,display:"flex",alignItems:"center",gap:3}} onClick={() => onDecompose(card)} title="Decompose task">
              <IconK name="sparkle" size={10}/>
              {card.tags && card.tags.includes("has-subtasks") ? "⊞" : "÷"}
            </button>
          )}
          {onPushGitHub && (
            <button className="btn btn-ghost" style={{padding:"2px 7px",fontSize:10,height:22,borderRadius:4,display:"flex",alignItems:"center",gap:3}} onClick={() => onPushGitHub(card)} title="Push to GitHub">
              <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
              GitHub
            </button>

    </div>
  );
}

function normalizeChecklist(raw) {
  let arr = raw;
  if (typeof raw === "string") {
    try { arr = JSON.parse(raw); } catch (_) { arr = []; }
  }
  if (!Array.isArray(arr)) return [];
  return arr.map((x) => ({
    text: typeof x === "string" ? x : (x && x.text != null) ? String(x.text) : "",
    done: !!(x && typeof x === "object" && x.done),
  }));
}

function Kanban({ t, lang, project, currentUser }) {
  const [board, setBoard] = useStateK({ backlog: [], doing: [], review: [], done: [] });
  const [filter, setFilter] = useStateK("all"); // all | mine | unassigned
  const [detail, setDetail] = useStateK(null);
  const [showAdd, setShowAdd] = useStateK(null);
  const [newTitle, setNewTitle] = useStateK("");
  const [teammates, setTeammates] = useStateK([]);
  const [taskComments, setTaskComments] = useStateK([]);
  const [decomposeCard, setDecomposeCard] = useStateK(null);
  const [decomposeCount, setDecomposeCount] = useStateK(3);
  const [decomposeLoading, setDecomposeLoading] = useStateK(false);

  const PRIO_ORDER = { p0: 0, urgent: 0, high: 1, alta: 1, med: 2, media: 2, low: 3, baja: 3 };
  const sortByPrioThenDue = (cards) => [...cards].sort((a, b) => {
    const pa = PRIO_ORDER[a.prio] ?? 2;
    const pb = PRIO_ORDER[b.prio] ?? 2;
    if (pa !== pb) return pa - pb;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1;
    if (b.due) return 1;
    return 0;
  });
  const autoReorgEnabled = () => {
    try { return (JSON.parse(localStorage.getItem("quark_settings_toggles_v1") || "{}")).autoReorg !== false; } catch (_) { return true; }
  };
  const reorganize = () => {
    setBoard(b => {
      const next = {};
      for (const col of Object.keys(b)) { next[col] = sortByPrioThenDue(b[col]); }
      return next;
    });
  };

  const reportError = React.useCallback((error, fallback) => {
    if (!error) return false;
    console.error(fallback, error);
    alert(humanSupabaseError(error, fallback));
    return true;
  }, []);

  const loadTeammates = React.useCallback(async () => {
    const { data } = await supabase.from('profiles').select('*');
    if (data) {
      setTeammates(data.map(p => ({
        id: p.id,
        name: p.name,
        color: p.color,
        initials: (p.name || "U").slice(0, 2).toUpperCase()
      })));
    }
  }, []);

  const loadTasks = React.useCallback(async () => {
    const { data, error } = await supabase.from('tasks').select('*').eq('project_name', project);
    if (error || !data) return;
    const countByTask = {};
    const ids = data.map((tk) => tk.id);
    if (ids.length) {
      const { data: cc } = await supabase.from('task_comments').select('task_id').in('task_id', ids);
      cc?.forEach((row) => {
        countByTask[row.task_id] = (countByTask[row.task_id] || 0) + 1;
      });
    }
    const b = { backlog: [], doing: [], review: [], done: [] };
    data.forEach((task) => {
      if (!b[task.status]) return;
      b[task.status].push({
        id: task.id,
        title: task.title,
        description: task.description || '',
        proj: task.project_name,
        code: task.code && String(task.code).trim() !== '' ? task.code : 'TSK',
        prio: task.priority,
        tags: task.tags || [],
        assignee: task.assignee_ids || [],
        comments: countByTask[task.id] || 0,
        checks: null,
        checklist: normalizeChecklist(task.checklist),
        due: task.due,
        blocked: task.blocked,
        blockReason: task.block_reason,
        stuck: task.stuck,
        stuckDays: task.stuck_days,
        aiNote: task.ai_note,
        createdBy: task.created_by,
      });
    });
    if (autoReorgEnabled()) {
      const sorted = {};
      for (const col of Object.keys(b)) { sorted[col] = sortByPrioThenDue(b[col]); }
      setBoard(sorted);
    } else {
      setBoard(b);
    }
  }, [project]);

  const reloadComments = React.useCallback(async (taskId) => {
    if (!taskId) { setTaskComments([]); return; }
    const { data } = await supabase.from('task_comments').select('*').eq('task_id', taskId).order('created_at', { ascending: true });
    setTaskComments(data || []);
  }, []);

  useEffectK(() => {
    reloadComments(detail?.id || null);
  }, [detail?.id, reloadComments]);

  useEffectK(() => {
    if (!detail?.id) return undefined;
    const ch = supabase
      .channel(`task-comments-${detail.id}`)
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "task_comments", filter: `task_id=eq.${detail.id}` },
        () => { reloadComments(detail.id); loadTasks(); }
      )
      .subscribe();
    return () => { supabase.removeChannel(ch); };
  }, [detail?.id, reloadComments, loadTasks]);

  useEffectK(() => {
    loadTasks();
    loadTeammates();
    const chanTasks = supabase.channel('tasks-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: `project_name=eq.${project}` }, () => {
         loadTasks();
      }).subscribe();
    const chanProf = supabase.channel('profiles-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
         loadTeammates();
      }).subscribe();
    return () => { 
      supabase.removeChannel(chanTasks); 
      supabase.removeChannel(chanProf);
    };
  }, [project, loadTasks, loadTeammates]);

  const cols = [
    { id: "backlog", title: lang === "es" ? "Backlog" : "Backlog", sub: lang === "es" ? "Por hacer" : "To do", accent: "var(--fg-3)" },
    { id: "doing", title: lang === "es" ? "Doing" : "Doing", sub: lang === "es" ? "En progreso" : "In progress", accent: "var(--violet)" },
    { id: "review", title: "Review", sub: lang === "es" ? "Revisión" : "In review", accent: "var(--amber)" },
    { id: "done", title: "Done", sub: lang === "es" ? "Completado" : "Completed", accent: "var(--green)" },
  ];

  const moveCard = async (cardId, fromCol, toCol) => {
    if (fromCol === toCol) return;
    const previousBoard = board;
    setBoard(b => {
      const card = b[fromCol].find(c => c.id === cardId);
      if (!card) return b;
      const cleaned = { ...card };
      if (toCol === "done") { delete cleaned.blocked; delete cleaned.stuck; }
      return {
        ...b,
        [fromCol]: b[fromCol].filter(c => c.id !== cardId),
        [toCol]: [...b[toCol], cleaned]
      };
    });
    
    const updates = { status: toCol };
    if (toCol === "done") { updates.blocked = false; updates.stuck = false; }
    const { error } = await supabase.from('tasks').update(updates).eq('id', cardId);
    if (reportError(error, lang === "es" ? "No se pudo mover la tarjeta." : "Could not move card.")) {
      setBoard(previousBoard);
      await loadTasks();
    }
  };

  const updateAssignee = async (cardId, ids) => {
    setBoard(b => {
      const next = {};
      for (const colId of Object.keys(b)) {
        next[colId] = b[colId].map(c => c.id === cardId ? { ...c, assignee: ids } : c);
      }
      return next;
    });
    if (detail && detail.id === cardId) setDetail(d => ({ ...d, assignee: ids }));
    const { error } = await supabase.from('tasks').update({ assignee_ids: ids }).eq('id', cardId);
    if (reportError(error, lang === "es" ? "No se pudo actualizar la asignación." : "Could not update assignee.")) await loadTasks();
  };

  const applyPatchToCard = (c, dbPatch) => {
    const next = { ...c };
    if (dbPatch.title != null) next.title = dbPatch.title;
    if (dbPatch.description != null) next.description = dbPatch.description;
    if (dbPatch.due !== undefined) next.due = dbPatch.due;
    if (dbPatch.priority != null) next.prio = dbPatch.priority;
    if (dbPatch.tags != null) next.tags = dbPatch.tags;
    if (dbPatch.checklist != null) next.checklist = normalizeChecklist(dbPatch.checklist);
    return next;
  };

  const saveTaskPatch = async (id, fields) => {
    const dbPatch = {};
    if (fields.title != null) dbPatch.title = fields.title;
    if (fields.description != null) dbPatch.description = fields.description;
    if (fields.due !== undefined) dbPatch.due = fields.due;
    if (fields.priority != null) dbPatch.priority = fields.priority;
    if (fields.tags != null) dbPatch.tags = fields.tags;
    if (fields.checklist != null) dbPatch.checklist = fields.checklist;
    if (Object.keys(dbPatch).length === 0) return;
    const { error } = await supabase.from('tasks').update(dbPatch).eq('id', id);
    if (reportError(error, lang === "es" ? "No se pudo guardar la tarjeta." : "Could not save card.")) {
      await loadTasks();
      return;
    }
    setBoard((b) => {
      const n = { ...b };
      for (const col of Object.keys(n)) {
        n[col] = n[col].map((c) => (c.id === id ? applyPatchToCard(c, dbPatch) : c));
      }
      return n;
    });
    setDetail((d) => (d && d.id === id ? applyPatchToCard(d, dbPatch) : d));
  };

  const deleteTaskById = async (id) => {
    const { error } = await supabase.from('tasks').delete().eq('id', id);
    if (reportError(error, lang === "es" ? "No se pudo eliminar la tarjeta." : "Could not delete card.")) return;
    setDetail(null);
    setTaskComments([]);
    await loadTasks();
  };

  const decomposeTask = async (card, count) => {
    setDecomposeLoading(true);
    try {
      const subtasks = [];
      for (let i = 1; i <= count; i++) {
        subtasks.push({
          title: `${card.title} - Part ${i}`,
          project_name: card.proj,
          status: 'doing',
          priority: card.prio || 'med',
        });
      }
      const { error: insertErr } = await supabase.from('tasks').insert(subtasks);
      if (insertErr) { alert(lang === "es" ? "No se pudieron crear las subtareas." : "Could not create subtasks."); setDecomposeLoading(false); return; }
      // Tag parent with has-subtasks
      const existingTags = card.tags || [];
      if (!existingTags.includes("has-subtasks")) {
        await supabase.from('tasks').update({ tags: [...existingTags, "has-subtasks"] }).eq('id', card.id);
      }
      setDecomposeCard(null);
      await loadTasks();
    } finally {
      setDecomposeLoading(false);
    }
  };

  const pushToGitHub = async (card) => {
    const integrations = (() => { try { return JSON.parse(localStorage.getItem("quark_integrations") || "{}"); } catch (_) { return {}; } })();
    const token = integrations.GitHub;
    if (!token) { alert(lang === "es" ? "No hay token de GitHub configurado. Ve a Ajustes → Integraciones." : "No GitHub token configured. Go to Settings → Integrations."); return; }
    // Parse "owner/repo" from stored ghRepo or default
    const repo = integrations.GitHubRepo || "";
    if (!repo || !repo.includes("/")) { alert(lang === "es" ? "Configura el repositorio GitHub (owner/repo) en Integraciones." : "Set your GitHub repository (owner/repo) in Integrations."); return; }
    try {
      const res = await fetch(`https://api.github.com/repos/${repo}/issues`, {
        method: "POST",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ title: card.title, body: card.description || "", labels: card.tags || [] })
      });
      if (!res.ok) { const j = await res.json(); alert(`GitHub error: ${j.message || res.status}`); return; }
      const issue = await res.json();
      alert(lang === "es" ? `Issue creado: #${issue.number}` : `Issue created: #${issue.number}`);
    } catch (err) {
      alert(lang === "es" ? "Error al conectar con GitHub." : "Error connecting to GitHub.");
    }
  };

  const postCommentTask = async (taskId, text) => {
    const { data: u } = await supabase.auth.getUser();
    const uid = u?.user?.id;
    if (!uid) return;
    const { error } = await supabase.from('task_comments').insert({ task_id: taskId, user_id: uid, content: text });
    if (reportError(error, lang === "es" ? "No se pudo publicar el comentario." : "Could not post comment.")) return;
    await reloadComments(taskId);
    await loadTasks();
  };

  const onDrop = (e, colId) => {
    const cardId = e.dataTransfer.getData("text/cardId");
    if (!cardId) return;
    const fromCol = Object.keys(board).find(k => board[k].some(c => c.id === cardId));
    if (fromCol) moveCard(cardId, fromCol, colId);
    e.currentTarget.classList.remove("over");
  };

  const uidMine = currentUser?.id;
  const matchFilter = (c) => {
    const asg = c.assignee || [];
    if (filter === "mine") return !!uidMine && asg.includes(uidMine);
    if (filter === "unassigned") return asg.length === 0;
    return true;
  };

  const addCard = async (colId) => {
    if (!newTitle.trim()) { setShowAdd(null); return; }
    const title = newTitle.trim();
    setNewTitle("");
    setShowAdd(null);
    
    const { data: userData } = await supabase.auth.getUser();
    const uid = userData?.user?.id;
    
    const { error } = await supabase.from('tasks').insert({
      title: title,
      project_name: project,
      status: colId,
      priority: 'med',
      created_by: uid || null
    });
    if (reportError(error, lang === "es" ? "No se pudo crear la tarjeta." : "Could not create card.")) return;
    await loadTasks();
  };

  // Detect bottleneck (>2 in review or stuck cards)
  const reviewCount = board.review.length;
  const stuckCount = board.review.filter(c => c.stuck).length;

  return (
    <div className="page kb-page">
      <div className="page-head">
        <div>
          <h1>{lang === "es" ? "Tablero" : "Board"} <em>Kanban</em></h1>
          <p>{lang === "es"
            ? "Mismo proyecto para todo el equipo (como Trello): cada quien entra con su cuenta; las tarjetas son colaborativas — editar, comentar y eliminar las puede cualquier miembro del tablero."
            : "One shared project for the team (like Trello): everyone signs in with their own account; cards are collaborative — any board member can edit, comment or delete."}</p>
        </div>
        <button 
          className="btn btn-primary" 
          style={{height: 36, whiteSpace: "nowrap"}}
          onClick={() => {
            const url = window.location.origin + window.location.pathname + "?project=" + encodeURIComponent(project);
            navigator.clipboard.writeText(url);
            alert(lang === "es" ? "¡URL copiada al portapapeles!" : "URL copied to clipboard!");
          }}
        >
          <IconK name="link" size={14}/>
          {lang === "es" ? "Compartir" : "Share"}
        </button>
      </div>

      <div className="kb-toolbar">
        <div className="seg">
          <button className={filter === "all" ? "active" : ""} onClick={() => setFilter("all")}>{lang === "es" ? "Todas" : "All"}</button>
          <button className={filter === "mine" ? "active" : ""} onClick={() => setFilter("mine")}>{lang === "es" ? "Mis tareas" : "Mine"}</button>
          <button className={filter === "unassigned" ? "active" : ""} onClick={() => setFilter("unassigned")}>{lang === "es" ? "Sin asignar" : "Unassigned"}</button>
        </div>
        <button className="btn btn-ghost" style={{height: 30, padding: "0 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 5}} onClick={reorganize} title={lang === "es" ? "Ordenar por prioridad y fecha" : "Sort by priority and due date"}>
          <IconK name="optimize" size={13}/>
          {lang === "es" ? "Reorganizar" : "Reorganize"}
        </button>
        <div className="kb-team">
          <span style={{fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--fg-3)", letterSpacing: "0.1em", marginRight: 4}}>{lang === "es" ? "EQUIPO" : "TEAM"}</span>
          {teammates.map(u => <Avatar key={u.id} user={u} size={24} ring={true}/>)}
          <button className="kb-add-team"><IconK name="plus" size={12}/></button>
        </div>
        {(reviewCount >= 3 || stuckCount > 0) && (
          <div className="kb-ai-pill">
            <span style={{
              width: 18, height: 18, borderRadius: 4,
              background: "var(--amber-fog)", border: "1px solid var(--amber)",
              display: "grid", placeItems: "center", color: "var(--amber)"
            }}><IconK name="warn" size={11}/></span>
            <span>{lang === "es"
              ? `Cuello de botella en Review · ${reviewCount} tarjetas, ${stuckCount} estancadas`
              : `Bottleneck in Review · ${reviewCount} cards, ${stuckCount} stuck`}</span>
            <span className="kb-ai-cta">{lang === "es" ? "Resolver" : "Resolve"} →</span>
          </div>
        )}
      </div>

      <div className="kb-board">
        {cols.map(col => {
          const cards = board[col.id].filter(matchFilter);
          return (
            <div key={col.id} className="kb-col"
              onDragOver={(e) => { e.preventDefault(); e.currentTarget.classList.add("over"); }}
              onDragLeave={(e) => e.currentTarget.classList.remove("over")}
              onDrop={(e) => onDrop(e, col.id)}>
              <div className="kb-col-head">
                <span className="kb-col-dot" style={{background: col.accent, boxShadow: `0 0 8px ${col.accent}`}}/>
                <div>
                  <div className="kb-col-title">{col.title}</div>
                  <div className="kb-col-sub">{col.sub} · {cards.length}</div>
                </div>
                <button className="kb-col-add" onClick={() => setShowAdd(col.id)} title={lang === "es" ? "Añadir tarjeta" : "Add card"}>
                  <IconK name="plus" size={14}/>
                </button>
              </div>

              <div className="kb-col-body">
                {showAdd === col.id && (
                  <div className="kb-card kb-card-new">
                    <textarea
                      autoFocus
                      placeholder={lang === "es" ? "Título de la tarjeta…" : "Card title…"}
                      value={newTitle}
                      onChange={e => setNewTitle(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addCard(col.id); }
                        if (e.key === "Escape") { setShowAdd(null); setNewTitle(""); }
                      }}
                    />
                    <div style={{display: "flex", gap: 6, marginTop: 8}}>
                      <button className="btn btn-primary" style={{padding: "5px 10px", fontSize: 12}} onClick={() => addCard(col.id)}>
                        {lang === "es" ? "Añadir" : "Add"}
                      </button>
                      <button className="btn btn-ghost" style={{padding: "5px 10px", fontSize: 12}} onClick={() => { setShowAdd(null); setNewTitle(""); }}>
                        {lang === "es" ? "Cancelar" : "Cancel"}
                      </button>
                    </div>
                  </div>
                )}
                {cards.map(card => (
                  <KanbanCard key={card.id} card={card}
                    onAssign={updateAssignee}
                    onClick={() => setDetail(card)}
                    teammates={teammates}
                    onDecompose={(c) => { setDecomposeCard(c); setDecomposeCount(3); }}
                    onPushGitHub={(() => { try { return JSON.parse(localStorage.getItem("quark_integrations") || "{}"); } catch(_) { return {}; } })().GitHub ? pushToGitHub : null}/>
                ))}
                {cards.length === 0 && showAdd !== col.id && (
                  <div className="kb-empty">{lang === "es" ? "Vacío" : "Empty"}</div>
                )}
              </div>

              {showAdd !== col.id && (
                <button className="kb-add-row" onClick={() => setShowAdd(col.id)}>
                  <IconK name="plus" size={12}/>
                  {lang === "es" ? "Añadir tarjeta" : "Add a card"}
                </button>
              )}
            </div>
          );
        })}
      </div>

      {detail && (
        <CardDetail
          card={detail}
          onClose={() => setDetail(null)}
          onAssign={updateAssignee}
          lang={lang}
          teammates={teammates}
          currentUser={currentUser}
          taskComments={taskComments}
          onSaveTask={saveTaskPatch}
          onDeleteTask={deleteTaskById}
          onPostComment={postCommentTask}
        />
      )}

      {decomposeCard && (
        <div style={{position:"fixed",inset:0,background:"oklch(0 0 0 / 0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000}} onClick={() => setDecomposeCard(null)}>
          <div style={{background:"var(--surface-elev)",border:"1px solid var(--line-strong)",borderRadius:"var(--r-lg)",padding:"28px 32px",width:340,boxShadow:"0 24px 64px oklch(0 0 0 / 0.5)"}} onClick={e => e.stopPropagation()}>
            <div style={{fontFamily:"var(--font-mono)",fontSize:10,letterSpacing:"0.12em",color:"var(--violet-hi)",marginBottom:8}}>
              {lang === "es" ? "DESCOMPONER TAREA" : "DECOMPOSE TASK"}
            </div>
            <div style={{fontSize:13,color:"var(--fg-1)",marginBottom:16,lineHeight:1.5}}>
              <strong>{decomposeCard.title}</strong>
            </div>
            <div style={{marginBottom:16}}>
              <label style={{fontSize:12,color:"var(--fg-2)",display:"block",marginBottom:6}}>
                {lang === "es" ? `Número de subtareas: ${decomposeCount}` : `Number of subtasks: ${decomposeCount}`}
              </label>
              <input type="range" min={2} max={5} value={decomposeCount} onChange={e => setDecomposeCount(Number(e.target.value))}
                style={{width:"100%",accentColor:"var(--violet)"}}/>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--fg-3)",marginTop:2}}>
                <span>2</span><span>3</span><span>4</span><span>5</span>
              </div>
            </div>
            <div style={{fontSize:11,color:"var(--fg-3)",marginBottom:16,lineHeight:1.5}}>
              {lang === "es"
                ? `Se crearán ${decomposeCount} subtareas: "${decomposeCard.title} - Part 1", etc.`
                : `Will create ${decomposeCount} subtasks: "${decomposeCard.title} - Part 1", etc.`}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-primary" style={{flex:1,height:34,fontSize:13}} disabled={decomposeLoading}
                onClick={() => decomposeTask(decomposeCard, decomposeCount)}>
                {decomposeLoading ? "…" : (lang === "es" ? "Descomponer" : "Decompose")}
              </button>
              <button className="btn btn-ghost" style={{height:34,padding:"0 14px",fontSize:13}} onClick={() => setDecomposeCard(null)}>
                {lang === "es" ? "Cancelar" : "Cancel"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

window.Login = Login;
window.Kanban = Kanban;

/* ============================================
   TOAST NOTIFICATION SYSTEM
   ============================================ */
const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = React.useState([]);

  const showToast = React.useCallback((message, type = "info", duration = 3500) => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts(prev => prev.map(t => t.id === id ? { ...t, leaving: true } : t));
      setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 330);
    }, duration);
  }, []);

  const iconMap = { success: "check", error: "warn", info: "sparkle" };
  const colorMap = { success: "var(--green)", error: "var(--rose)", info: "var(--violet-hi)" };

  return (
    <ToastContext.Provider value={showToast}>
      {children}
      <div className="toast-container">
        {toasts.map(toast => (
          <div key={toast.id} className={`toast ${toast.type} ${toast.leaving ? "leaving" : ""}`}>
            <span style={{ color: colorMap[toast.type], flexShrink: 0 }}>
              <IconK name={iconMap[toast.type] || "sparkle"} size={14}/>
            </span>
            <span>{toast.message}</span>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

function useToast() {
  return React.useContext(ToastContext) || (() => {});
}

/* Ripple effect — attach to any button with class btn-ripple */
function addRipple(e) {
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const circle = document.createElement("span");
  circle.className = "ripple-circle";
  circle.style.left = x + "px";
  circle.style.top = y + "px";
  btn.appendChild(circle);
  setTimeout(() => circle.remove(), 520);
}

// Apply ripple to primary buttons globally
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".btn-primary, .btn-routine-add, .kb-btn-save");
  if (btn) addRipple({ currentTarget: btn, clientX: e.clientX, clientY: e.clientY });
}, true);

window.ToastProvider = ToastProvider;
window.useToast = useToast;

      if (typeof Notification === "undefined") return;
      if (Notification.permission === "default") {
        Notification.requestPermission().then(p => { if (p === "granted") fireNotifs(); });

      }
      if (Notification.permission !== "granted") return;
      const today = new Date().toISOString().slice(0, 10);
      const overdue = allTasks.filter(tk => tk.due && tk.due < today && tk.status !== "done");
      if (overdue.length > 0) {

      if (stuck.length > 0) {
        new Notification(lang === "es" ? "Quark Tasking — Tareas estancadas" : "Quark Tasking — Stuck tasks", {

          icon: "/favicon.ico",
          tag: "quark-stuck"
        });
      }
    };
    fireNotifs();
    // Re-check once daily (86400000ms)
    const timer = setInterval(fireNotifs, 86400000);
    return () => clearInterval(timer);
  }, [allTasks, lang]);

  const t = QT3.I18N[lang];

  const navItems = [
    { id: "dashboard", label: t.nav_dashboard, icon: "dashboard" },
    { id: "board",     label: lang === "es" ? "Tablero" : "Board", icon: "roadmap", badge: lang === "es" ? "NUEVO" : "NEW" },
    { id: "capture",   label: t.nav_capture,   icon: "capture", badge: "AI" },

  const handleLogout = async () => {
    try {
      await supabase.auth.signOut();
      setUser(null);
    } catch (err) {
      console.error("Logout error:", err);
    }
  };

  useEffectApp(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        setPaletteOpen(true);
      }
      if (e.key === "Escape") setPaletteOpen(false);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const crumb = {
    dashboard: lang === "es" ? "Workspace · Dashboard" : "Workspace · Dashboard",
    board: lang === "es" ? "Workspace · Tablero Kanban" : "Workspace · Kanban Board",
    capture: lang === "es" ? "Workspace · Capturar" : "Workspace · Capture",
    roadmap: lang === "es" ? "Workspace · Roadmap" : "Workspace · Roadmap",
    optimize: lang === "es" ? "Workspace · Optimización IA" : "Workspace · AI Optimization",
    settings: lang === "es" ? "Workspace · Ajustes" : "Workspace · Settings",
  }[page] || "Quark Tasking";
  document.title = crumb;

  if (!user && window.Login) {
    return <window.Login lang={lang} onLangToggle={(v) => setTweak("lang", v)} onLogin={(u) => setUser(u)}/>;
  }

  return (
    <>
      <Cosmos/>
      <div className="app" data-density={density}>
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-mark"><BrandMark/></div>
            <div>
              <div className="brand-name">{t.appName}</div>
              <div className="brand-sub">{t.appSub}</div>
            </div>
          </div>

          <div className="nav-section">{t.nav_workspace}</div>
          {navItems.map(n => (
            <div key={n.id}
              className={`nav-item ${page === n.id ? "active" : ""}`}
              onClick={() => setPage(n.id)}>
              <span className="icon"><IconApp name={n.icon} size={15}/></span>
              <span>{n.label}</span>
              {n.badge && <span className="badge">{n.badge}</span>}
            </div>
          ))}

          <div className="nav-section">{t.nav_projects}</div>
          {projectsNav.map(p => (
            <div key={p.id} className={`nav-item ${project === p.name ? "active" : ""}`} style={{paddingLeft: 8}} onClick={() => { setProject(p.name); setPage("board"); }}>
              <span className="icon" style={{
                width: 16, height: 16, borderRadius: 4,
                background: `var(--${p.color}-fog)`,
                color: `var(--${p.color === "violet" ? "violet-hi" : p.color})`,
                fontFamily: "var(--font-mono)", fontSize: 9, fontWeight: 600,
                border: "1px solid var(--line-faint)"
              }}>{p.code}</span>
              <span style={{fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap"}}>{p.name}</span>
            </div>
          ))}
          <div className="nav-item" style={{color: "var(--fg-3)", marginTop: 4}} onClick={() => {
            const name = prompt(lang === "es" ? "Nombre del nuevo proyecto" : "New project name");
            if (name && name.trim()) { setProject(name.trim()); setPage("board"); }
          }}>
            <span className="icon"><IconApp name="plus" size={14}/></span>
            <span style={{fontSize: 12}}>{lang === "es" ? "Nuevo proyecto" : "New project"}</span>
          </div>

          <div style={{flex: 1}}/>

          <div style={{
            padding: 10,
            background: "var(--bg-1)",
            border: "1px solid var(--line-faint)",
            borderRadius: "var(--r-md)",
            fontSize: 11,
            color: "var(--fg-2)",
            lineHeight: 1.5
          }}>
            <div style={{
              display: "flex", alignItems: "center", gap: 6,
              fontFamily: "var(--font-mono)", fontSize: 10,
              color: "var(--violet-hi)", letterSpacing: "0.1em",
              textTransform: "uppercase", marginBottom: 6
            }}>
              <span className="dot" style={{display: "inline-block", width: 5, height: 5, background: "var(--violet)", borderRadius: "50%", boxShadow: "0 0 6px var(--violet)"}}></span>
              {lang === "es" ? "IA APRENDIENDO" : "AI LEARNING"}
            </div>
            <div>
              {lang === "es"
                ? "47 días observando tu ritmo. Confianza del modelo: 0.84."
                : "47 days observing your rhythm. Model confidence: 0.84."}
            </div>
          </div>
        </aside>

        <main className="main">
          <header className="topbar">
            <div className="crumb"><b>{crumb}</b></div>
            <div className="topbar-spacer"/>
            <button type="button" className="search" onClick={() => setPaletteOpen(true)} style={{cursor: "pointer", border: "1px solid var(--line-faint)"}}>
              <IconApp name="search" size={12}/>
              <span>{t.search}</span>
              <kbd>⌘K</kbd>
            </button>
            <div className="lang-toggle">
              <button className={lang === "es" ? "active" : ""} onClick={() => setTweak("lang", "es")}>ES</button>
              <button className={lang === "en" ? "active" : ""} onClick={() => setTweak("lang", "en")}>EN</button>
            </div>
            <button className="btn" style={{padding: "5px 10px"}}
              onClick={() => setTweak("theme", theme === "dark" ? "light" : "dark")}>
              <IconApp name={theme === "dark" ? "eye" : "lock"} size={13}/>
              <span style={{fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase"}}>
                {theme === "dark" ? (lang === "es" ? "Oscuro" : "Dark") : (lang === "es" ? "Claro" : "Light")}
              </span>
            </button>
            <div className="user-pill" onClick={handleLogout} title={lang === "es" ? "Cerrar sesión" : "Sign out"} style={{cursor: "pointer"}}>
              <div className="avatar">{user ? (user.name || "M").slice(0,2).toUpperCase() : "MA"}</div>
              <span style={{fontSize: 12}}>{user ? (user.name || "user").toLowerCase() : "user"}</span>
            </div>
          </header>

          {page === "dashboard" && Dashboard && <Dashboard t={t} lang={lang} tasks={allTasks} onOpenBoard={(name) => { setProject(name); setPage("board"); }} onOpenOptimize={(idx) => { setOptimizeInitial(idx); setPage("optimize"); }}/>}
          {page === "board" && window.Kanban && <window.Kanban t={t} lang={lang} project={project} currentUser={user ? { id: user.id, name: user.name } : null}/>}
          {page === "capture" && Capture && <Capture t={t} lang={lang} currentUser={user ? { id: user.id, name: user.name } : null}/>}
          {page === "roadmap" && Roadmap && <Roadmap t={t} lang={lang}/>}
          {page === "optimize" && Optimize && <Optimize t={t} lang={lang} initialIndex={optimizeInitial}/>}
          {page === "settings" && Settings && <Settings t={t} lang={lang}
            theme={theme} setTheme={(v) => setTweak("theme", v)}
            density={density} setDensity={(v) => setTweak("density", v)}
            aiVerbose={aiVerbose} setAiVerbose={(v) => setTweak("aiVerbose", v)}/>}
        </main>
      </div>

      {paletteOpen && (
        <div className="kb-modal-overlay" onClick={() => setPaletteOpen(false)}>
          <div className="kb-modal" style={{width: 560, maxHeight: "70vh", top: "12vh", transform: "translateX(-50%)", padding: 16}} onClick={(e) => e.stopPropagation()}>
            <input className="kb-title-input" autoFocus placeholder={lang === "es" ? "Buscar o ejecutar comando…" : "Search or run command…"} value={paletteQuery} onChange={(e) => setPaletteQuery(e.target.value)} />
            <div style={{display: "grid", gap: 8, marginTop: 14}}>
              {[
                { label: lang === "es" ? "Abrir tablero" : "Open board", action: () => setPage("board") },
                { label: lang === "es" ? "Capturar tareas" : "Capture tasks", action: () => setPage("capture") },
                { label: lang === "es" ? "Ver roadmap" : "Open roadmap", action: () => setPage("roadmap") },
                { label: lang === "es" ? "Optimización IA" : "AI optimization", action: () => setPage("optimize") },
                { label: lang === "es" ? "Ajustes" : "Settings", action: () => setPage("settings") },
                ...projectsNav.map(p => ({ label: `${lang === "es" ? "Proyecto" : "Project"}: ${p.name}`, action: () => { setProject(p.name); setPage("board"); } }))
              ].filter(item => item.label.toLowerCase().includes(paletteQuery.toLowerCase())).map((item, i) => (
                <button key={i} className="btn" style={{justifyContent: "flex-start"}} onClick={() => { item.action(); setPaletteOpen(false); setPaletteQuery(""); }}>
                  <IconApp name="arrow" size={14}/>{item.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Tweaks panel */}
      {TweaksPanel && (
        <TweaksPanel title="Tweaks">
          <TweakSection title={lang === "es" ? "Apariencia" : "Appearance"}>
            <TweakRadio
              label={lang === "es" ? "Tema" : "Theme"}
              value={theme}
              onChange={(v) => setTweak("theme", v)}
              options={[
                { value: "dark", label: lang === "es" ? "Oscuro" : "Dark" },
                { value: "light", label: lang === "es" ? "Claro" : "Light" }
              ]}/>
            <TweakRadio
              label={lang === "es" ? "Idioma" : "Language"}
              value={lang}
              onChange={(v) => setTweak("lang", v)}
              options={[
                { value: "es", label: "ES" },
                { value: "en", label: "EN" }
              ]}/>
          </TweakSection>
          <TweakSection title={lang === "es" ? "Comportamiento" : "Behavior"}>
            <TweakRadio
              label={lang === "es" ? "Densidad" : "Density"}
              value={density}
              onChange={(v) => setTweak("density", v)}
              options={[
                { value: "comfortable", label: lang === "es" ? "Cómodo" : "Comfort" },
                { value: "compact", label: lang === "es" ? "Compacto" : "Compact" }
              ]}/>
            <TweakRadio
              label={lang === "es" ? "Verbosidad IA" : "AI verbosity"}
              value={aiVerbose}
              onChange={(v) => setTweak("aiVerbose", v)}
              options={[
                { value: "low", label: lang === "es" ? "Min" : "Min" },
                { value: "med", label: lang === "es" ? "Med" : "Med" },
                { value: "high", label: lang === "es" ? "Alta" : "High" }
              ]}/>
          </TweakSection>
        </TweaksPanel>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <window.ToastProvider>
    <App/>
  </window.ToastProvider>
);

  </script>
</body>
</html>
